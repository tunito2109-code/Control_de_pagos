<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de pagos</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pagos">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --muted:#6C6C70; --line:#E5E5EA; --seg:#E3E3E8; --segon:#FFFFFF; --bar:rgba(242,242,247,.86);
  --blue:#2F4FD0; --blue-soft:#E4E9FB; --celeste:#2B9BDB; --celeste-soft:#DDF0FB; --green:#1E8A5A; --green-soft:#DDF3E8; --red:#C4301F; --red-soft:#FBE3DF;
  --onblue:#FFFFFF;
  color-scheme:light; box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#000000; --card:#1C1C1E; --ink:#F2F2F7; --muted:#98989F; --line:#38383A; --seg:#2C2C2E; --segon:#636366; --bar:rgba(0,0,0,.82);
    --blue:#7D95FF; --blue-soft:#1E2547; --celeste:#5CC2FF; --celeste-soft:#11324A; --green:#4CD38A; --green-soft:#12301F; --red:#FF6B5B; --red-soft:#3D1712;
    --onblue:#0B1230; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:600px;margin:0 auto;padding:12px 16px 10px}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.kicker{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.titlerow h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.tbtns{display:flex;gap:8px;flex:none}
.circ{width:44px;height:44px;border-radius:22px;border:0;display:grid;place-items:center;padding:0}
.circ.plus{background:var(--blue);color:var(--onblue)}
.circ.soft{background:var(--seg);color:var(--blue)}
.circ svg{width:20px;height:20px}
.segc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--seg);border-radius:10px;padding:3px;gap:2px}
.segc button{border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:500;padding:8px 0;color:var(--muted);white-space:nowrap}
.segc button[aria-current="page"]{background:var(--segon);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

main{max-width:600px;margin:0 auto;padding:18px 16px 48px;display:flex;flex-direction:column;gap:22px;min-height:70vh}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.pad{padding:16px}
.note{background:var(--card);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px}

/* Resumen */
.salary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.salary label{color:var(--muted);font-size:15px}
.salary .in{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:8px;padding:6px 10px}
.salary input{border:0;background:transparent;font-weight:600;width:9.5em;text-align:right;outline:none;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;color:var(--muted)}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 12px;font-variant-numeric:tabular-nums;word-break:break-word}
.big.pos{color:var(--green)} .big.neg{color:var(--red)} .big.blue{color:var(--blue)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog span{display:block;height:100%;border-radius:4px;background:var(--celeste);transition:width .35s}
.prog span.full{background:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats div{min-width:0;display:flex;flex-direction:column}
.stats b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stats small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:4px;flex:none;display:inline-block}
.c-green{color:var(--green)} .c-red{color:var(--red)} .c-blue{color:var(--blue)} .c-cel{color:var(--celeste)}
.bg-green{background:var(--green)} .bg-red{background:var(--red)} .bg-blue{background:var(--blue)} .bg-cel{background:var(--celeste)} .bg-ink{background:var(--muted)}

/* Listas */
.ghead{display:flex;justify-content:space-between;padding:0 4px 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:60px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .body{flex:1;min-width:0;background:none;border:0;padding:10px 0;text-align:left;display:flex;align-items:center;gap:10px;color:inherit}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{white-space:nowrap;font-variant-numeric:tabular-nums}
.row .amt.empty{color:var(--blue);font-size:14px;font-weight:500}
.row .chev{width:8px;height:14px;flex:none;color:var(--line)}
.row.paid .t,.row.paid .amt{color:var(--muted)}
.chk{flex:none;width:28px;height:28px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.chk svg{width:14px;height:14px;opacity:0}
.row.paid .chk{background:var(--green);border-color:var(--green)}
.row.paid .chk svg{opacity:1}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.tag.ok{background:var(--green-soft);color:var(--green)}
.who{flex:none;width:32px;height:32px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:13px}
.who.r{background:var(--blue-soft);color:var(--blue)}
.who.s{background:var(--celeste-soft);color:var(--celeste)}
.amt.neg{color:var(--red)} .amt.pos{color:var(--green)}
.t.cap{text-transform:capitalize}
.mbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.mbar span{display:block;height:100%;background:var(--celeste)}
.mbar span.over{background:var(--red)}
.empty-list{padding:22px 16px;color:var(--muted);text-align:center}

.actions{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:600;background:var(--blue);color:var(--onblue);width:100%}
.btn.ghost{background:var(--card);color:var(--blue)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.green{background:var(--green-soft);color:var(--green)}

.owe{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.owe .arrow{color:var(--muted)}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:14px 14px 0 0;max-width:600px;margin:0 auto;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:22px;font-weight:700}
.sheet p{color:var(--muted);margin:0 0 16px}
.form{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:16px}
.field{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:50px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field>span{flex:none;width:96px;color:var(--muted);font-size:15px}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;font-size:16px;outline:none;text-align:right;color:var(--ink)}
.field select{direction:rtl;appearance:none;-webkit-appearance:none;color:var(--blue);background:none}
[hidden]{display:none!important}
.field select option{direction:ltr}
.field input[type=date],.field input[type=month]{text-align:right}
.field.stack{flex-direction:column;align-items:stretch;gap:8px;padding:12px 14px}
.field.stack>span{width:auto}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--seg);border-radius:9px;padding:2px;gap:2px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted)}
.seg input:checked+span{background:var(--segon);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:3px solid var(--blue)}
.row-btns{display:flex;gap:10px}
.row-btns .btn{flex:1}
.err{color:var(--red);font-size:14px;min-height:1.2em;margin:-8px 4px 8px}
.chkline{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:14px;margin-bottom:16px}
.chkline input{width:22px;height:22px;accent-color:var(--blue);flex:none}
.dl{display:grid;grid-template-columns:1fr auto;gap:10px 12px;margin:0;padding:14px;background:var(--card);border-radius:12px}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.dl dd.neg{color:var(--red)} .dl dd.pos{color:var(--green)}
.sheet .ghead{margin-top:18px}

/* Categorías */
.catrow{display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-top:1px solid var(--line);min-height:50px}
.catrow:first-child{border-top:0}
.catrow input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none;color:var(--ink)}
.catrow .uses{color:var(--muted);font-size:13px;white-space:nowrap}
.catrow .x{border:0;background:none;color:var(--red);width:40px;height:40px;flex:none;border-radius:20px;display:grid;place-items:center}
.catrow .x svg{width:22px;height:22px}
.catrow .x.sure{width:auto;padding:0 12px;font-size:13px;font-weight:600;background:var(--red-soft)}
.catadd{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:6px}
.catadd input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;outline:none;color:var(--ink)}
.catadd .btn{width:auto;padding:10px 16px;border-radius:9px}
.sheet .segc{margin-bottom:14px;grid-template-columns:repeat(3,minmax(0,1fr))}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in" id="topbar"></div></header>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
const DEF_CATS={
  fijos:["Alquiler / Vivienda","Tarjeta de Crédito","Tarjeta / Billetera Virtual","Préstamos / Financiación","Servicios","Impuestos / Tasas","Seguros","Otros"],
  chicos:["Comida","Nafta / Transporte","Farmacia","Varios"],
  comp:["Supermercado","Combustible / Auto","Salidas / Ocio","Casa","Servicios","Otros"]
};
const DIV={mitad:"Mitad y mitad",rodri:"Todo de Rodri",sabri:"Todo de Sabri"};
const TABS=["fijos","chicos","comp","hist"];
const COLL={fijos:"fijos",chicos:"chicos",compartidos:"comp",historial:"hist"};
const CATKEY={fijos:"fijos",chicos:"chicos",compartidos:"comp"};

const S={sueldo:null,fijos:[],chicos:[],comp:[],hist:[],cats:null};
let tab="fijos";
try{const h=location.hash.slice(1); if(TABS.includes(h)) tab=h;}catch(e){}

/* ---------- formato ---------- */
const nf=new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:0,maximumFractionDigits:2});
const money=n=>nf.format(Number(n)||0);
const digits=n=>new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(Math.abs(Number(n)||0));
function parseMoney(str){
  if(str==null) return null;
  let s=String(str).replace(/[^\d.,-]/g,"").trim();
  if(!s) return null;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s)) s=s.replace(/\./g,"");
  const n=parseFloat(s); return isFinite(n)?Math.round(n*100)/100:null;
}
const fmtIn=n=>n==null||n===""?"":new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(n);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function defMes(){ const d=new Date(); if(d.getDate()<=15) d.setMonth(d.getMonth()-1,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
const mesLabel=k=>{ const [y,m]=String(k).split("-").map(Number); return y&&m?new Date(y,m-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"}):String(k); };
function fmtDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("es-AR",{day:"numeric",month:"short"}); }
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const bigMoney=n=>`<span class="cur">$</span>${digits(n)}`;

/* ---------- datos (en este celu) ---------- */
const LKEY="control-pagos-local-v1";
const SEED={sueldo:1848130.76,
  fijos:[["f01","ALQUILER","Alquiler / Vivienda",600000],["f02","MACRO VISA SUSI","Tarjeta de Crédito",564000],["f03","MERCADO MASTER RODRI","Tarjeta de Crédito",630000],["f04","MERCADOPAGO RODRI","Tarjeta / Billetera Virtual",243000],["f05","REFINANCIACION ICBC","Préstamos / Financiación",294000],["f06","LUZ","Servicios",null],["f07","GAS","Servicios",null],["f08","AGUA","Servicios",null],["f09","MUNICIPAL","Impuestos / Tasas",null]].map((r,i)=>({id:r[0],desc:r[1],cat:r[2],monto:r[3],pagado:false,orden:i+1})),
  chicos:[{id:"c01",desc:"Carga de nafta (use macro)",cat:"Nafta / Transporte",monto:70000,fecha:"2026-11-04",creado:1}],
  comp:[{id:"s01",desc:"Nafta YPF",cat:"Combustible / Auto",monto:40000,pagador:"Rodri",division:"mitad",fecha:"2025-05-10",notas:"Carga tanque común",creado:1},
        {id:"s02",desc:"Supermercado Coto",cat:"Supermercado",monto:65000,pagador:"Sabri",division:"mitad",fecha:"2025-05-12",notas:"Compras del mes",creado:2},
        {id:"s03",desc:"Cena / Salida",cat:"Salidas / Ocio",monto:28000,pagador:"Rodri",division:"mitad",fecha:"2025-05-15",notas:"Cena fin de semana",creado:3}],
  hist:[]};
function applyData(v){
  S.sueldo=v.sueldo??null; S.fijos=v.fijos||[]; S.chicos=v.chicos||[]; S.comp=v.comp||[]; S.hist=v.hist||[];
  S.cats=v.cats&&v.cats.fijos?v.cats:JSON.parse(JSON.stringify(DEF_CATS));
  for(const k of ["fijos","chicos","comp"]){ if(!Array.isArray(S.cats[k])) S.cats[k]=[...DEF_CATS[k]];
    for(const x of S[k]) if(x.cat&&!S.cats[k].includes(x.cat)) S.cats[k].push(x.cat); }
}
function load(){
  let v=null;
  try{ v=JSON.parse(localStorage.getItem(LKEY)||"null"); }catch(e){}
  applyData(v||JSON.parse(JSON.stringify(SEED)));
  if(!v) save();
}
function save(){ try{ localStorage.setItem(LKEY,JSON.stringify({sueldo:S.sueldo,fijos:S.fijos,chicos:S.chicos,comp:S.comp,hist:S.hist,cats:S.cats})); return true; }catch(e){ toast("No se pudo guardar en este celu"); return false; } }
function put(coll,id,data){ const a=S[COLL[coll]]; const i=a.findIndex(x=>x.id===id); if(i>=0) a[i]={id,...data}; else a.push({id,...data}); const ok=save(); render(); return ok; }
function del(coll,id){ S[COLL[coll]]=S[COLL[coll]].filter(x=>x.id!==id); save(); render(); }

/* ---------- cálculos ---------- */
function calc(){
  const fijos=[...S.fijos].sort((a,b)=>(a.orden??0)-(b.orden??0));
  const totalF=fijos.reduce((t,x)=>t+(Number(x.monto)||0),0);
  const pagado=fijos.filter(x=>x.pagado).reduce((t,x)=>t+(Number(x.monto)||0),0);
  const totalC=S.chicos.reduce((t,x)=>t+(Number(x.monto)||0),0);
  const sueldo=Number(S.sueldo)||0;
  let pr=0,ps=0,parteR=0,totalS=0;
  for(const x of S.comp){ const m=Number(x.monto)||0; totalS+=m;
    if(x.pagador==="Sabri") ps+=m; else pr+=m;
    parteR+= x.division==="rodri"?m : x.division==="sabri"?0 : m/2; }
  const neto=Math.round((pr-parteR)*100)/100;
  return {fijos,totalF,pagado,falta:totalF-pagado,totalC,sueldo,saldo:sueldo-totalF,resto:sueldo-totalF-totalC,pr,ps,totalS,neto};
}

/* ---------- vistas ---------- */
const CHECK='<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV='<svg class="chev" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M1 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PLUS='<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const TAGS='<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5h9M15 5h2M3 10h2M8 10h9M3 15h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="13.5" cy="5" r="1.8" stroke="currentColor" stroke-width="1.6"/><circle cx="6.5" cy="10" r="1.8" stroke="currentColor" stroke-width="1.6"/><circle cx="15.5" cy="15" r="1.8" stroke="currentColor" stroke-width="1.6"/></svg>';
const MINUS='<svg viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="currentColor"/><path d="M7 11h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
const app=document.getElementById("app"), topbar=document.getElementById("topbar");
const TITLES={fijos:"Gastos fijos",chicos:"Del día",comp:"Rodri y Sabri",hist:"Historial"};
const SEGN={fijos:"Fijos",chicos:"Del día",comp:"Compartidos",hist:"Historial"};
const ADD={fijos:"fijos",chicos:"chicos",comp:"compartidos"};

function renderTop(){
  const mes=new Date().toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  topbar.innerHTML=`<div class="titlerow"><div><div class="kicker">${esc(mes)}</div><h1>${TITLES[tab]}</h1></div>
    <div class="tbtns">${tab!=="hist"?`<button class="circ soft" id="catsBtn" aria-label="Editar categorías">${TAGS}</button>
    <button class="circ plus" id="addBtn" aria-label="Agregar">${PLUS}</button>`:""}</div></div>
    <nav class="segc" aria-label="Secciones">${TABS.map(t=>`<button data-tab="${t}" aria-current="${t===tab?"page":"false"}">${SEGN[t]}</button>`).join("")}</nav>`;
  topbar.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
  const cb=document.getElementById("catsBtn"); if(cb) cb.onclick=()=>openCats(tab==="comp"?"comp":tab);
  const ab=document.getElementById("addBtn"); if(ab) ab.onclick=()=>openForm(ADD[tab],null);
}
function goTab(t){ if(t===tab) return; tab=t; try{history.replaceState(null,"","#"+t)}catch(e){} window.scrollTo(0,0); render(); }

function render(){
  renderTop();
  const c=calc();
  const h= tab==="fijos"?viewFijos(c): tab==="chicos"?viewChicos(c): tab==="hist"?viewHist(c): viewComp(c);
  const y=window.scrollY; app.innerHTML=h; window.scrollTo(0,y);
  bindView();
}

function viewFijos(c){
  const pct=c.totalF>0?Math.min(100,c.pagado/c.totalF*100):0;
  const paid=c.fijos.filter(x=>x.pagado).length;
  let h=`<section class="card pad" aria-label="Resumen">
    <div class="salary"><label for="sueldoIn">Sueldo del mes</label>
      <span class="in"><span class="lbl">$</span><input id="sueldoIn" inputmode="decimal" placeholder="0" value="${fmtIn(S.sueldo)}" aria-label="Sueldo del mes en pesos"></span></div>
    <div class="lbl">${c.saldo<0?"Te faltan para cubrir los fijos":"Te queda después de los fijos"}</div>
    <div class="big ${c.saldo<0?"neg":"pos"}">${money(Math.abs(c.saldo))}</div>
    <div class="prog" role="progressbar" aria-label="Porcentaje pagado" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><span class="${pct>=100?"full":""}" style="width:${pct}%"></span></div>
    <div class="stats">
      <div><b>${money(c.totalF)}</b><small><i class="dot bg-ink"></i>Total fijos</small></div>
      <div><b class="c-green">${money(c.pagado)}</b><small><i class="dot bg-green"></i>Ya pagaste</small></div>
      <div><b class="c-red">${money(c.falta)}</b><small><i class="dot bg-red"></i>Falta pagar</small></div>
    </div></section>
  <section><div class="ghead"><span>Pagos</span><span>${paid} de ${c.fijos.length} pagados</span></div><div class="card">`;
  if(!c.fijos.length) h+=`<div class="empty-list">Todavía no hay gastos fijos. Tocá + para agregar.</div>`;
  for(const x of c.fijos){
    const hasM=x.monto!=null&&x.monto!=="";
    h+=`<div class="row ${x.pagado?"paid":""}">
      <button class="chk" data-toggle="${esc(x.id)}" aria-pressed="${!!x.pagado}" aria-label="${x.pagado?"Marcar como pendiente":"Marcar como pagado"}: ${esc(x.desc)}">${CHECK}</button>
      <button class="body" data-edit="fijos" data-id="${esc(x.id)}">
        <div class="txt"><div class="t">${esc(x.desc)}</div><div class="s">${esc(x.cat||"Sin categoría")}${x.pagado?'<span class="tag ok">Pagado</span>':""}</div></div>
        <span class="amt ${hasM?"":"empty"}">${hasM?money(x.monto):"Cargar monto"}</span>${CHEV}
      </button></div>`;
  }
  h+=`</div></section><div class="actions"><button class="btn ghost" id="nuevoMes">Cerrar el mes y empezar otro</button></div>`;
  return h;
}

function viewChicos(c){
  const list=[...S.chicos].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
  let h=`<section class="card pad" aria-label="Resumen">
    <div class="lbl">Gastaste en el día a día</div>
    <div class="big blue">${money(c.totalC)}</div>
    <div class="stats two">
      <div><b>${money(c.saldo)}</b><small><i class="dot bg-ink"></i>Libre tras los fijos</small></div>
      <div><b class="${c.resto<0?"c-red":"c-green"}">${money(c.resto)}</b><small><i class="dot ${c.resto<0?"bg-red":"bg-green"}"></i>Te queda ahora</small></div>
    </div></section>
  <section><div class="ghead"><span>Movimientos</span><span>${list.length}</span></div><div class="card">`;
  if(!list.length) h+=`<div class="empty-list">Nada anotado todavía. Tocá + para agregar.</div>`;
  for(const x of list){
    h+=`<div class="row"><button class="body" data-edit="chicos" data-id="${esc(x.id)}">
      <div class="txt"><div class="t">${esc(x.desc)}</div><div class="s">${esc([fmtDate(x.fecha),x.cat].filter(Boolean).join(" · "))}</div></div>
      <span class="amt">${money(x.monto)}</span>${CHEV}</button></div>`;
  }
  return h+`</div></section>`;
}

function viewComp(c){
  const list=[...S.comp].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
  const even=Math.abs(c.neto)<0.005;
  const de=c.neto>0?"Sabri":"Rodri", a=c.neto>0?"Rodri":"Sabri";
  let h=`<section class="card pad" aria-label="Balance">
    <div class="owe">${even?'<span class="c-green">Cuentas al día</span>':`<span class="${de==="Rodri"?"c-blue":"c-cel"}">${de}</span><span class="arrow">le debe a</span><span class="${a==="Rodri"?"c-blue":"c-cel"}">${a}</span>`}</div>
    <div class="big ${even?"pos":"neg"}">${money(Math.abs(c.neto))}</div>
    <div class="stats two">
      <div><b class="c-blue">${money(c.pr)}</b><small><i class="dot bg-blue"></i>Pagó Rodri</small></div>
      <div><b class="c-cel">${money(c.ps)}</b><small><i class="dot bg-cel"></i>Pagó Sabri</small></div>
    </div></section>
  ${!even?`<div class="actions"><button class="btn green" id="saldar">Registrar que se saldó</button></div>`:""}
  <section><div class="ghead"><span>Gastos en común</span><span>Total ${money(c.totalS)}</span></div><div class="card">`;
  if(!list.length) h+=`<div class="empty-list">Sin gastos compartidos. Tocá + para agregar.</div>`;
  for(const x of list){
    const p=x.pagador==="Sabri"?"s":"r";
    const sub=[fmtDate(x.fecha),x.cat,x.division&&x.division!=="mitad"?DIV[x.division]:null,x.notas].filter(Boolean).join(" · ");
    h+=`<div class="row"><span class="who ${p}" aria-label="Pagó ${p==="s"?"Sabri":"Rodri"}">${p==="s"?"S":"R"}</span>
      <button class="body" data-edit="compartidos" data-id="${esc(x.id)}">
      <div class="txt"><div class="t">${esc(x.desc)}</div><div class="s">${esc(sub)}</div></div>
      <span class="amt">${money(x.monto)}</span>${CHEV}</button></div>`;
  }
  return h+`</div></section>`;
}

function viewHist(c){
  const list=[...S.hist].sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  let h="";
  if(list.length){
    const avg=list.reduce((t,m)=>t+(m.totalF||0)+(m.totalC||0),0)/list.length;
    h+=`<section class="card pad" aria-label="Resumen"><div class="lbl">Gasto promedio por mes</div>
      <div class="big blue">${money(avg)}</div>
      <div class="stats two"><div><b>${list.length}</b><small><i class="dot bg-ink"></i>${list.length===1?"Mes guardado":"Meses guardados"}</small></div>
      <div><b class="c-cel">${money(c.totalF+c.totalC)}</b><small><i class="dot bg-cel"></i>Este mes, hasta ahora</small></div></div></section>`;
  }
  h+=`<section><div class="ghead"><span>Meses cerrados</span></div><div class="card">`;
  if(!list.length) h+=`<div class="empty-list">Cuando cierres un mes desde Fijos, va a quedar guardado acá con todos sus pagos.</div>`;
  for(const m of list){
    const gastos=(m.totalF||0)+(m.totalC||0), saldo=(m.sueldo||0)-gastos;
    const pct=m.sueldo>0?Math.min(100,gastos/m.sueldo*100):100;
    h+=`<div class="row"><button class="body" data-hist="${esc(m.id)}">
      <div class="txt"><div class="t cap">${esc(mesLabel(m.id))}</div><div class="s">Gastaste ${money(gastos)} de ${money(m.sueldo)}</div>
      <div class="mbar"><span class="${gastos>(m.sueldo||0)?"over":""}" style="width:${pct}%"></span></div></div>
      <span class="amt ${saldo<0?"neg":"pos"}">${saldo<0?"−":"+"}${money(Math.abs(saldo))}</span>${CHEV}</button></div>`;
  }
  h+=`</div></section>
  <section><div class="ghead"><span>Copia de seguridad</span></div>
  <div class="note">Tus datos viven solo en este celu. Guardá una copia de vez en cuando por si cambiás de teléfono.</div></section>
  <div class="actions"><button class="btn" id="bkSave">Guardar copia</button>
    <button class="btn ghost" id="bkLoad">Restaurar desde una copia</button>
    <input type="file" id="bkFile" accept="application/json,.json" hidden></div>`;
  return h;
}

function bindView(){
  const si=document.getElementById("sueldoIn");
  if(si){ si.addEventListener("change",()=>{ S.sueldo=parseMoney(si.value); save(); render(); });
    si.addEventListener("keydown",e=>{ if(e.key==="Enter") si.blur(); }); }
  app.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
    const x=S.fijos.find(f=>f.id===b.dataset.toggle); if(!x) return; x.pagado=!x.pagado; save(); render(); });
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openForm(b.dataset.edit,b.dataset.id));
  app.querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>openHist(b.dataset.hist));
  const on=(id,f)=>{ const e=document.getElementById(id); if(e) e.onclick=f; };
  on("nuevoMes",openNuevoMes); on("saldar",openSaldar); on("bkSave",saveBackup);
  const bf=document.getElementById("bkFile"), bl=document.getElementById("bkLoad");
  if(bl&&bf){ bl.onclick=()=>bf.click(); bf.onchange=()=>{ if(bf.files[0]) loadBackup(bf.files[0]); bf.value=""; }; }
}

/* ---------- deslizar para cambiar de sección ---------- */
(function(){
  let x0=null,y0=null,t0=0;
  app.addEventListener("touchstart",e=>{ if(e.touches.length!==1||e.target.closest("input,select")){x0=null;return;} x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
  app.addEventListener("touchend",e=>{
    if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8||Date.now()-t0>600) return;
    const i=TABS.indexOf(tab)+(dx<0?1:-1); if(i>=0&&i<TABS.length) goTab(TABS[i]);
  },{passive:true});
})();

/* ---------- hoja inferior ---------- */
const sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim");
let lastFocus=null;
function openSheet(html,focus=true){
  lastFocus=document.activeElement;
  sheet.innerHTML='<div class="grab"></div>'+html; sheet.scrollTop=0;
  sheet.classList.add("on"); scrim.classList.add("on");
  if(focus) setTimeout(()=>{ const f=sheet.querySelector("input:not([type=radio]):not([type=checkbox]):not([type=date])"); if(f) f.focus({preventScroll:true}); },280);
}
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); if(lastFocus) try{lastFocus.focus({preventScroll:true})}catch(e){} }
scrim.onclick=closeSheet;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheet.classList.contains("on")) closeSheet(); });

const seg=(name,pairs,v)=>`<div class="seg" role="radiogroup">${pairs.map(([val,lbl])=>`<label><input type="radio" name="${name}" value="${val}" ${val===v?"checked":""}><span>${esc(lbl)}</span></label>`).join("")}</div>`;
function catSelect(key,cur){
  const list=[...S.cats[key]]; if(cur&&!list.includes(cur)) list.push(cur);
  return `<label class="field"><span>Categoría</span><select name="cat">
    <option value="" ${!cur?"selected":""}>Sin categoría</option>
    ${list.map(a=>`<option ${a===cur?"selected":""}>${esc(a)}</option>`).join("")}
    <option value="__new">+ Nueva categoría…</option></select></label>
    <label class="field" id="newCatF" hidden><span>Nueva</span><input name="newcat" autocomplete="off" placeholder="Nombre de la categoría"></label>`;
}

function openForm(coll,id){
  const x=id?S[COLL[coll]].find(i=>i.id===id):null;
  const key=CATKEY[coll];
  let title,fields;
  if(coll==="fijos"){
    title=x?"Editar gasto fijo":"Nuevo gasto fijo";
    fields=`<div class="form"><label class="field"><span>Descripción</span><input name="desc" value="${esc(x?.desc||"")}" placeholder="Ej: Alquiler" autocomplete="off"></label>
      <label class="field"><span>Monto</span><input name="monto" inputmode="decimal" value="${fmtIn(x?.monto)}" placeholder="Vacío si no llegó"></label>
      ${catSelect(key,x?x.cat:"")}</div>
      <div class="form"><div class="field stack"><span>Estado</span>${seg("pagado",[["0","Pendiente"],["1","Pagado"]],x?.pagado?"1":"0")}</div></div>`;
  }else if(coll==="chicos"){
    title=x?"Editar gasto":"Nuevo gasto del día";
    fields=`<div class="form"><label class="field"><span>Descripción</span><input name="desc" value="${esc(x?.desc||"")}" placeholder="Ej: Carga de nafta" autocomplete="off"></label>
      <label class="field"><span>Monto</span><input name="monto" inputmode="decimal" value="${fmtIn(x?.monto)}" placeholder="0"></label>
      ${catSelect(key,x?x.cat:"")}
      <label class="field"><span>Fecha</span><input name="fecha" type="date" value="${esc(x?.fecha||today())}"></label></div>`;
  }else{
    title=x?"Editar gasto compartido":"Nuevo gasto compartido";
    fields=`<div class="form"><label class="field"><span>Descripción</span><input name="desc" value="${esc(x?.desc||"")}" placeholder="Ej: Supermercado" autocomplete="off"></label>
      <label class="field"><span>Monto total</span><input name="monto" inputmode="decimal" value="${fmtIn(x?.monto)}" placeholder="0"></label>
      ${catSelect(key,x?x.cat:"")}
      <label class="field"><span>Fecha</span><input name="fecha" type="date" value="${esc(x?.fecha||today())}"></label>
      <label class="field"><span>Notas</span><input name="notas" value="${esc(x?.notas||"")}" placeholder="Opcional" autocomplete="off"></label></div>
      <div class="form"><div class="field stack"><span>¿Quién pagó?</span>${seg("pagador",[["Rodri","Rodri"],["Sabri","Sabri"]],x?.pagador||"Rodri")}</div>
      <div class="field stack"><span>¿Cómo se divide?</span>${seg("division",[["mitad","Mitad"],["rodri","Todo Rodri"],["sabri","Todo Sabri"]],x?.division||"mitad")}</div></div>`;
  }
  openSheet(`<h3 id="sheetTitle">${title}</h3><form id="f" novalidate>${fields}
    <div class="err" id="ferr" role="alert"></div>
    <div class="row-btns">${x?`<button type="button" class="btn danger" id="fdel">Borrar</button>`:""}
    <button type="submit" class="btn">${x?"Guardar":"Agregar"}</button></div></form>`);
  const f=document.getElementById("f");
  const sel=f.elements.cat, nc=document.getElementById("newCatF");
  sel.onchange=()=>{ nc.hidden=sel.value!=="__new"; if(!nc.hidden) f.elements.newcat.focus(); };
  f.onsubmit=e=>{
    e.preventDefault();
    const g=n=>f.elements[n]?f.elements[n].value:undefined;
    const err=document.getElementById("ferr");
    const desc=(g("desc")||"").trim(); const monto=parseMoney(g("monto"));
    if(!desc){ err.textContent="Escribí una descripción."; return; }
    if(coll!=="fijos"&&(monto==null||monto<=0)){ err.textContent="Ingresá un monto mayor a cero."; return; }
    let cat=g("cat");
    if(cat==="__new"){
      cat=(g("newcat")||"").trim();
      if(!cat){ err.textContent="Escribí el nombre de la categoría."; return; }
      const exist=S.cats[key].find(c=>c.toLowerCase()===cat.toLowerCase());
      if(exist) cat=exist; else S.cats[key].push(cat);
    }
    let data;
    if(coll==="fijos"){
      const maxO=S.fijos.reduce((m,i)=>Math.max(m,i.orden??0),0);
      data={desc,monto,cat,pagado:g("pagado")==="1",orden:x?.orden??maxO+1};
    }else if(coll==="chicos"){
      data={desc,monto,cat,fecha:g("fecha")||today(),creado:x?.creado??Date.now()};
    }else{
      data={desc,monto,pagador:g("pagador"),division:g("division"),cat,fecha:g("fecha")||today(),notas:(g("notas")||"").trim(),creado:x?.creado??Date.now()};
    }
    put(coll,x?x.id:newId(),data); closeSheet(); toast(x?"Guardado":"Agregado");
  };
  const fd=document.getElementById("fdel");
  if(fd) fd.onclick=()=>{ if(fd.dataset.sure){ del(coll,x.id); closeSheet(); toast("Borrado"); } else { fd.dataset.sure="1"; fd.textContent="Tocá de nuevo"; } };
}

/* ---------- categorías ---------- */
function openCats(key){
  const names={fijos:"Fijos",chicos:"Del día",comp:"Compartidos"};
  const uses=c=>S[key].filter(x=>x.cat===c).length;
  const rows=S.cats[key].map((c,i)=>{ const n=uses(c);
    return `<div class="catrow"><input value="${esc(c)}" data-i="${i}" aria-label="Nombre de la categoría ${esc(c)}">
      <span class="uses">${n?n+(n===1?" uso":" usos"):""}</span>
      <button class="x" data-del="${i}" aria-label="Borrar categoría ${esc(c)}">${MINUS}</button></div>`; }).join("");
  openSheet(`<h3 id="sheetTitle">Categorías</h3>
    <div class="segc">${["fijos","chicos","comp"].map(k=>`<button data-ck="${k}" aria-current="${k===key?"page":"false"}">${names[k]}</button>`).join("")}</div>
    <p>Tocá un nombre para cambiarlo. Los gastos que la usan se actualizan solos.</p>
    <div class="form">${rows||`<div class="empty-list">No hay categorías.</div>`}</div>
    <div class="catadd"><input id="catNew" placeholder="Nueva categoría" autocomplete="off" aria-label="Nueva categoría"><button class="btn" id="catAdd">Agregar</button></div>
    <div class="err" id="cerr" role="alert" style="margin:4px"></div>
    <div class="row-btns" style="margin-top:8px"><button class="btn ghost" id="catClose">Listo</button></div>`,false);
  sheet.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>openCats(b.dataset.ck));
  const cerr=document.getElementById("cerr");
  sheet.querySelectorAll(".catrow input").forEach(inp=>{
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") inp.blur(); });
    inp.addEventListener("change",()=>{
      const i=+inp.dataset.i, old=S.cats[key][i], nu=inp.value.trim();
      if(!nu){ inp.value=old; cerr.textContent="El nombre no puede quedar vacío."; return; }
      if(nu!==old&&S.cats[key].some((c,j)=>j!==i&&c.toLowerCase()===nu.toLowerCase())){ inp.value=old; cerr.textContent="Ya existe una categoría con ese nombre."; return; }
      cerr.textContent="";
      S.cats[key][i]=nu; for(const x of S[key]) if(x.cat===old) x.cat=nu;
      save(); render(); toast("Categoría renombrada");
    });
  });
  sheet.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.del, c=S.cats[key][i], n=uses(c);
    if(n&&!b.dataset.sure){ b.dataset.sure="1"; b.classList.add("sure"); b.textContent=`Borrar (${n} sin categoría)`; return; }
    S.cats[key].splice(i,1); for(const x of S[key]) if(x.cat===c) x.cat="";
    save(); render(); openCats(key); toast("Categoría borrada");
  });
  const add=()=>{ const v=document.getElementById("catNew").value.trim();
    if(!v) return;
    if(S.cats[key].some(c=>c.toLowerCase()===v.toLowerCase())){ cerr.textContent="Esa categoría ya existe."; return; }
    S.cats[key].push(v); save(); openCats(key); toast("Categoría agregada");
    setTimeout(()=>{ const n=document.getElementById("catNew"); if(n) n.focus(); },50); };
  document.getElementById("catAdd").onclick=add;
  document.getElementById("catNew").addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
  document.getElementById("catClose").onclick=closeSheet;
}
/* ---------- cierre de mes, saldo, historial ---------- */
function openNuevoMes(){
  const n=S.chicos.length;
  openSheet(`<h3 id="sheetTitle">Cerrar el mes</h3>
    <div class="form"><label class="field"><span>Mes que cerrás</span><input type="month" id="nmMes" value="${defMes()}"></label></div>
    <p>Se guarda en el historial con todos sus pagos. Después los fijos vuelven a pendiente; los montos y el sueldo quedan para que solo cambies lo que varió.</p>
    <label class="chkline"><input type="checkbox" id="borrarChicos" ${n?"checked":""}><span>Borrar también los gastos del día (${n})</span></label>
    <div class="row-btns"><button class="btn ghost" id="nmNo">Cancelar</button><button class="btn" id="nmSi">Cerrar mes</button></div>`,false);
  document.getElementById("nmNo").onclick=closeSheet;
  document.getElementById("nmSi").onclick=()=>{
    const mes=document.getElementById("nmMes").value, borrar=document.getElementById("borrarChicos").checked;
    if(!/^\d{4}-\d{2}$/.test(mes)){ toast("Elegí el mes que cerrás"); return; }
    const c=calc();
    const snap={sueldo:c.sueldo,totalF:c.totalF,pagado:c.pagado,totalC:c.totalC,neto:c.neto,cerrado:Date.now(),
      fijos:c.fijos.map(x=>({desc:x.desc||"",cat:x.cat||"",monto:x.monto??null,pagado:!!x.pagado})),
      chicos:S.chicos.map(x=>({desc:x.desc||"",cat:x.cat||"",monto:Number(x.monto)||0,fecha:x.fecha||""}))};
    const i=S.hist.findIndex(h=>h.id===mes); if(i>=0) S.hist[i]={id:mes,...snap}; else S.hist.push({id:mes,...snap});
    S.fijos.forEach(x=>x.pagado=false); if(borrar) S.chicos=[];
    save(); closeSheet(); render(); toast("Mes guardado en el historial");
  };
}
function openSaldar(){
  const c=calc(); const de=c.neto>0?"Sabri":"Rodri", a=c.neto>0?"Rodri":"Sabri", m=Math.abs(c.neto);
  openSheet(`<h3 id="sheetTitle">Saldar cuentas</h3>
    <p>Se anota un pago de ${money(m)} de ${de} a ${a} y el balance queda en cero. El historial se conserva.</p>
    <div class="row-btns"><button class="btn ghost" id="sdNo">Cancelar</button><button class="btn" id="sdSi">Registrar pago</button></div>`,false);
  document.getElementById("sdNo").onclick=closeSheet;
  document.getElementById("sdSi").onclick=()=>{
    put("compartidos",newId(),{desc:`Pago de ${de} a ${a}`,monto:m,pagador:de,division:a==="Rodri"?"rodri":"sabri",cat:"",fecha:today(),notas:"Saldo de cuentas",creado:Date.now()});
    closeSheet(); toast("Cuentas saldadas");
  };
}
function openHist(id){
  const m=S.hist.find(x=>x.id===id); if(!m) return;
  const gastos=(m.totalF||0)+(m.totalC||0), saldo=(m.sueldo||0)-gastos, neto=m.neto||0;
  const bal=Math.abs(neto)<0.005?"Al día":(neto>0?"Sabri le debía ":"Rodri le debía ")+money(Math.abs(neto));
  const line=(t,s,a,cls)=>`<div class="row"><div class="body"><div class="txt"><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div></div><span class="amt ${cls||""}">${a}</span></div></div>`;
  const fij=(m.fijos||[]).map(x=>line(x.desc,(x.pagado?"Pagado":"Quedó pendiente")+(x.cat?" · "+x.cat:""),x.monto==null?"—":money(x.monto),x.pagado?"":"neg")).join("")||`<div class="empty-list">Sin gastos fijos</div>`;
  const chi=[...(m.chicos||[])].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).map(x=>line(x.desc,[fmtDate(x.fecha),x.cat].filter(Boolean).join(" · "),money(x.monto))).join("")||`<div class="empty-list">Sin gastos del día</div>`;
  openSheet(`<h3 id="sheetTitle" style="text-transform:capitalize">${esc(mesLabel(id))}</h3>
    <dl class="dl"><dt>Sueldo</dt><dd>${money(m.sueldo)}</dd><dt>Gastos fijos</dt><dd>${money(m.totalF)}</dd>
      <dt>Gastos del día</dt><dd>${money(m.totalC)}</dd><dt>${saldo<0?"Faltó":"Sobró"}</dt><dd class="${saldo<0?"neg":"pos"}">${money(Math.abs(saldo))}</dd>
      <dt>Compartidos al cierre</dt><dd>${esc(bal)}</dd></dl>
    <div class="ghead"><span>Fijos</span><span>${(m.fijos||[]).filter(x=>x.pagado).length} de ${(m.fijos||[]).length} pagados</span></div><div class="card">${fij}</div>
    <div class="ghead"><span>Del día</span></div><div class="card">${chi}</div>
    <div class="row-btns" style="margin-top:18px"><button class="btn danger" id="hdel">Borrar mes</button><button class="btn ghost" id="hclose">Cerrar</button></div>`,false);
  document.getElementById("hclose").onclick=closeSheet;
  const hd=document.getElementById("hdel");
  hd.onclick=()=>{ if(hd.dataset.sure){ del("historial",id); closeSheet(); toast("Mes borrado"); } else { hd.dataset.sure="1"; hd.textContent="Tocá de nuevo"; } };
}

/* ---------- copia de seguridad ---------- */
async function saveBackup(){
  const name="pagos-copia-"+today()+".json";
  const data={app:"control-pagos",version:2,guardado:new Date().toISOString(),sueldo:S.sueldo,fijos:S.fijos,chicos:S.chicos,comp:S.comp,hist:S.hist,cats:S.cats};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  try{ const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Copia de pagos"}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("Copia guardada");
}
function loadBackup(file){
  const r=new FileReader();
  r.onload=()=>{ try{
      const v=JSON.parse(r.result); if(!v||v.app!=="control-pagos") throw 0;
      openSheet(`<h3 id="sheetTitle">Restaurar copia</h3>
        <p>Se reemplaza todo lo que hay ahora por la copia del ${esc(new Date(v.guardado).toLocaleDateString("es-AR"))}.</p>
        <div class="row-btns"><button class="btn ghost" id="rbNo">Cancelar</button><button class="btn" id="rbSi">Restaurar</button></div>`,false);
      document.getElementById("rbNo").onclick=closeSheet;
      document.getElementById("rbSi").onclick=()=>{ applyData(v); save(); closeSheet(); render(); toast("Copia restaurada"); };
    }catch(e){ toast("Ese archivo no es una copia de esta app"); } };
  r.readAsText(file);
}

let tt; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2000); }

window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(TABS.includes(h)&&h!==tab){ tab=h; render(); } });

load(); render();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
})();
</script>
