<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de pagos</title>
<meta name="theme-color" content="#0A0A09">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pagos">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A09; --surface:#131210; --raise:#1B1A17; --line:#2A2722; --line2:#3D3830;
  --ink:#EEE7D7; --muted:#8E867A; --gold:#D6A83E; --gold2:#F2CF7A; --golddim:#4A3A16;
  --ok:#9CC79A; --bad:#E8876A;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.caps{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500}

main{max-width:560px;margin:0 auto;padding:22px 20px 120px}

/* Encabezado */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line2);margin-bottom:22px}
.mast .kicker{color:var(--gold)}
.mast h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,9vw,2.4rem);white-space:nowrap;line-height:1;margin:6px 0 0;letter-spacing:-.01em}
.mast h1 em{color:var(--gold)}
.gear{border:1px solid var(--line2);background:none;border-radius:999px;padding:8px 12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:none}
.gear svg{width:15px;height:15px}

.note{border-left:2px solid var(--gold);padding:6px 12px;color:var(--muted);font-size:.9rem;margin:0 0 18px}

/* Sueldo */
.salary{display:flex;align-items:baseline;gap:10px;margin-bottom:26px}
.salary label{color:var(--muted);flex:none}
.salary .lead{flex:1;border-bottom:1px dotted var(--line2);min-width:10px;transform:translateY(-4px)}
.salary .in{display:flex;align-items:baseline;gap:2px;border-bottom:1px solid var(--gold);padding:2px 0}
.salary input{border:0;background:transparent;font-family:var(--mono);font-size:1.05rem;width:9.5em;text-align:right;outline:none;color:var(--ink)}
.salary .cur{color:var(--muted);font-family:var(--mono)}

/* Cifra principal */
.figure .lbl{color:var(--muted)}
.figure .big{font-family:var(--serif);font-size:clamp(3rem,15vw,4.1rem);line-height:1;color:var(--gold2);margin:8px 0 18px;letter-spacing:-.02em;word-break:break-word}
.figure .big .cur{font-size:.5em;color:var(--gold);margin-right:4px;vertical-align:.55em}
.figure .big.neg{color:var(--bad)}
.figure .big.neg .cur{color:var(--bad)}
.rule{height:3px;background:var(--line);position:relative;margin-bottom:16px}
.rule span{position:absolute;inset:0 auto 0 0;background:var(--gold);transition:width .4s}
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trio>div{padding:12px 0 12px 12px;border-left:1px solid var(--line);min-width:0}
.trio>div:first-child{border-left:0;padding-left:0}
.trio.two{grid-template-columns:1fr 1fr}
.trio b{display:block;font-family:var(--mono);font-weight:500;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trio small{color:var(--muted);font-size:.78rem}

/* Lista tipo libro */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 4px}
.sec h2{font-family:var(--serif);font-weight:400;font-size:1.55rem;margin:0}
.sec span{color:var(--muted);font-family:var(--mono);font-size:.82rem}
.ledger{border-top:1px solid var(--line2)}
.item{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);min-height:60px}
.item .body{flex:1;min-width:0;background:none;border:0;padding:12px 0;text-align:left;display:block;color:inherit}
.l1{display:flex;align-items:baseline;gap:8px}
.l1 .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.l1 .lead{flex:1;border-bottom:1px dotted var(--line2);min-width:14px;transform:translateY(-4px)}
.l1 .amt{font-family:var(--mono);white-space:nowrap}
.l1 .amt.empty{color:var(--gold);font-family:var(--sans);font-size:.82rem;font-weight:500}
.item .s{color:var(--muted);font-size:.8rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.paid .t,.item.paid .amt{color:var(--muted)}
.item.paid .amt{text-decoration:line-through;text-decoration-color:var(--gold)}
.chk{flex:none;width:26px;height:26px;border:1.5px solid var(--line2);background:none;border-radius:4px;display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;opacity:0}
.item.paid .chk{background:var(--gold);border-color:var(--gold)}
.item.paid .chk svg{opacity:1}
.who{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:1rem;border:1px solid}
.who.r{color:var(--gold);border-color:var(--gold)}
.who.s{color:var(--ink);border-color:var(--line2)}
.amt.neg{color:var(--bad)} .amt.pos{color:var(--ok)}
.t.cap{text-transform:capitalize}
.mbar{height:2px;background:var(--line);margin-top:8px}
.mbar span{display:block;height:100%;background:var(--gold)}
.mbar span.over{background:var(--bad)}
.empty-list{padding:24px 0;color:var(--muted);font-style:italic;font-family:var(--serif);font-size:1.15rem}

.actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn{border:0;border-radius:6px;padding:14px 16px;font-weight:600;background:var(--gold);color:#16120A;width:100%;letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);font-weight:500}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.btn:disabled{opacity:.45}

/* Balance */
.owe{display:flex;align-items:center;gap:10px;color:var(--muted)}
.owe .arrow{color:var(--gold)}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:16px 2px 18px;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--gold2)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--gold)}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-top:2px solid var(--gold);
  max-width:560px;margin:0 auto;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .25s ease;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0}
.sheet.on{transform:none}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:1.9rem;margin:0 0 18px;line-height:1.1}
.sheet p{color:var(--muted);margin:0 0 16px}
.field{display:block;margin-bottom:18px}
.field>span{display:block;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:8px 0;background:transparent;font-size:1.05rem;color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-bottom-color:var(--gold)}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:20px}
.field select option{background:var(--surface);color:var(--ink)}
.field input.money{font-family:var(--mono)}
.field input[type=date],.field input[type=month]{font-family:var(--mono);color-scheme:dark}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;min-width:0;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line2);border-radius:6px;color:var(--muted);font-size:.88rem}
.seg input:checked+span{border-color:var(--gold);color:var(--gold2);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.seg input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.row-btns{display:flex;gap:10px;margin-top:8px}
.row-btns .btn{flex:1}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:0 0 6px}
.chkline{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.chkline input{width:20px;height:20px;accent-color:var(--gold);margin-top:2px;flex:none}
.dl{display:grid;grid-template-columns:1fr auto;gap:10px 12px;margin:0 0 8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-family:var(--mono);text-align:right}
.dl dd.neg{color:var(--bad)} .dl dd.pos{color:var(--ok)}
.mini .item{min-height:46px}
.mini .body{padding:8px 0}

/* Categorías */
.cattabs{display:flex;gap:6px;margin-bottom:16px}
.cattabs button{flex:1;border:1px solid var(--line2);background:none;border-radius:6px;padding:9px 4px;color:var(--muted);font-size:.85rem}
.cattabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2)}
.catrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.catrow input{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;font-size:1rem;outline:none;color:var(--ink)}
.catrow input:focus{color:var(--gold2)}
.catrow .uses{color:var(--muted);font-family:var(--mono);font-size:.78rem;white-space:nowrap}
.catrow .x{border:0;background:none;color:var(--muted);width:36px;height:36px;font-size:1.2rem;flex:none;border-radius:6px}
.catrow .x.sure{color:var(--bad);width:auto;font-size:.8rem;padding:0 8px;border:1px solid var(--bad)}
.catadd{display:flex;gap:8px;margin-top:14px}
.catadd input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:10px 0;outline:none;color:var(--ink)}
.catadd input:focus{border-bottom-color:var(--gold)}
.catadd .btn{width:auto;padding:10px 16px}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--gold);color:#16120A;padding:9px 16px;border-radius:6px;font-weight:600;font-size:.88rem;opacity:0;transition:.2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" aria-label="Secciones"><div class="in">
  <button class="caps" data-tab="fijos">Fijos</button>
  <button class="caps" data-tab="chicos">Del día</button>
  <button class="caps" data-tab="comp">Compartidos</button>
  <button class="caps" data-tab="hist">Historial</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
const DEF_CATS={
  fijos:["Alquiler / Vivienda","Tarjeta de Crédito","Tarjeta / Billetera Virtual","Préstamos / Financiación","Servicios","Impuestos / Tasas","Seguros","Otros"],
  chicos:["Comida","Nafta / Transporte","Farmacia","Varios"],
  comp:["Supermercado","Combustible / Auto","Salidas / Ocio","Casa","Servicios","Otros"]
};
const DIV={mitad:"Mitad y mitad",rodri:"Todo de Rodri",sabri:"Todo de Sabri"};
const TABS=["fijos","chicos","comp","hist"];
const COLL={fijos:"fijos",chicos:"chicos",compartidos:"comp",historial:"hist"};
const CATKEY={fijos:"fijos",chicos:"chicos",compartidos:"comp"};

const S={sueldo:null,fijos:[],chicos:[],comp:[],hist:[],cats:null};
let tab="fijos";
try{const h=location.hash.slice(1); if(TABS.includes(h)) tab=h;}catch(e){}

/* ---------- formato ---------- */
const nf=new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:0,maximumFractionDigits:2});
const money=n=>nf.format(Number(n)||0);
const digits=n=>new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(Math.abs(Number(n)||0));
function parseMoney(str){
  if(str==null) return null;
  let s=String(str).replace(/[^\d.,-]/g,"").trim();
  if(!s) return null;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s)) s=s.replace(/\./g,"");
  const n=parseFloat(s); return isFinite(n)?Math.round(n*100)/100:null;
}
const fmtIn=n=>n==null||n===""?"":new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(n);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function defMes(){ const d=new Date(); if(d.getDate()<=15) d.setMonth(d.getMonth()-1,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
const mesLabel=k=>{ const [y,m]=String(k).split("-").map(Number); return y&&m?new Date(y,m-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"}):String(k); };
function fmtDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("es-AR",{day:"numeric",month:"short"}); }
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const bigMoney=n=>`<span class="cur">$</span>${digits(n)}`;

/* ---------- datos (en este celu) ---------- */
const LKEY="control-pagos-local-v1";
const SEED={sueldo:1848130.76,
  fijos:[["f01","ALQUILER","Alquiler / Vivienda",600000],["f02","MACRO VISA SUSI","Tarjeta de Crédito",564000],["f03","MERCADO MASTER RODRI","Tarjeta de Crédito",630000],["f04","MERCADOPAGO RODRI","Tarjeta / Billetera Virtual",243000],["f05","REFINANCIACION ICBC","Préstamos / Financiación",294000],["f06","LUZ","Servicios",null],["f07","GAS","Servicios",null],["f08","AGUA","Servicios",null],["f09","MUNICIPAL","Impuestos / Tasas",null]].map((r,i)=>({id:r[0],desc:r[1],cat:r[2],monto:r[3],pagado:false,orden:i+1})),
  chicos:[{id:"c01",desc:"Carga de nafta (use macro)",cat:"Nafta / Transporte",monto:70000,fecha:"2026-11-04",creado:1}],
  comp:[{id:"s01",desc:"Nafta YPF",cat:"Combustible / Auto",monto:40000,pagador:"Rodri",division:"mitad",fecha:"2025-05-10",notas:"Carga tanque común",creado:1},
        {id:"s02",desc:"Supermercado Coto",cat:"Supermercado",monto:65000,pagador:"Sabri",division:"mitad",fecha:"2025-05-12",notas:"Compras del mes",creado:2},
        {id:"s03",desc:"Cena / Salida",cat:"Salidas / Ocio",monto:28000,pagador:"Rodri",division:"mitad",fecha:"2025-05-15",notas:"Cena fin de semana",creado:3}],
  hist:[]};
function applyData(v){
  S.sueldo=v.sueldo??null; S.fijos=v.fijos||[]; S.chicos=v.chicos||[]; S.comp=v.comp||[]; S.hist=v.hist||[];
  S.cats=v.cats&&v.cats.fijos?v.cats:JSON.parse(JSON.stringify(DEF_CATS));
  for(const k of ["fijos","chicos","comp"]){ if(!Array.isArray(S.cats[k])) S.cats[k]=[...DEF_CATS[k]];
    for(const x of S[k]) if(x.cat&&!S.cats[k].includes(x.cat)) S.cats[k].push(x.cat); }
}
function load(){
  let v=null;
  try{ v=JSON.parse(localStorage.getItem(LKEY)||"null"); }catch(e){}
  applyData(v||JSON.parse(JSON.stringify(SEED)));
  if(!v) save();
}
function save(){ try{ localStorage.setItem(LKEY,JSON.stringify({sueldo:S.sueldo,fijos:S.fijos,chicos:S.chicos,comp:S.comp,hist:S.hist,cats:S.cats})); return true; }catch(e){ toast("No se pudo guardar en este celu"); return false; } }
function put(coll,id,data){ const a=S[COLL[coll]]; const i=a.findIndex(x=>x.id===id); if(i>=0) a[i]={id,...data}; else a.push({id,...data}); const ok=save(); render(); return ok; }
function del(coll,id){ S[COLL[coll]]=S[COLL[coll]].filter(x=>x.id!==id); save(); render(); }

/* ---------- cálculos ---------- */
function calc(){
  const fijos=[...S.fijos].sort((a,b)=>(a.orden??0)-(b.orden??0));
  const totalF=fijos.reduce((t,x)=>t+(Number(x.monto)||0),0);
  const pagado=fijos.filter(x=>x.pagado).reduce((t,x)=>t+(Number(x.monto)||0),0);
  const totalC=S.chicos.reduce((t,x)=>t+(Number(x.monto)||0),0);
  const sueldo=Number(S.sueldo)||0;
  let pr=0,ps=0,parteR=0,totalS=0;
  for(const x of S.comp){ const m=Number(x.monto)||0; totalS+=m;
    if(x.pagador==="Sabri") ps+=m; else pr+=m;
    parteR+= x.division==="rodri"?m : x.division==="sabri"?0 : m/2; }
  const neto=Math.round((pr-parteR)*100)/100;
  return {fijos,totalF,pagado,falta:totalF-pagado,totalC,sueldo,saldo:sueldo-totalF,resto:sueldo-totalF-totalC,pr,ps,totalS,neto};
}

/* ---------- vistas ---------- */
const CHECK='<svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="#16120A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const GEAR='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h7M12 4h2M2 8h2M7 8h7M2 12h9M14 12h0"/><circle cx="10.5" cy="4" r="1.5"/><circle cx="5.5" cy="8" r="1.5"/><circle cx="12.5" cy="12" r="1.5"/></svg>';
const app=document.getElementById("app");
const TITLES={fijos:"Gastos <em>fijos</em>",chicos:"Del <em>día</em>",comp:"Rodri <em>&amp;</em> Sabri",hist:"<em>Historial</em>"};

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const c=calc();
  const mes=new Date().toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  let h=`<header class="mast"><div><div class="kicker caps">${esc(mes)}</div><h1>${TITLES[tab]}</h1></div>
    ${tab!=="hist"?`<button class="gear caps" id="catsBtn" aria-label="Editar categorías">${GEAR}Categorías</button>`:""}</header>`;
  h+= tab==="fijos"?viewFijos(c): tab==="chicos"?viewChicos(c): tab==="hist"?viewHist(c): viewComp(c);
  const y=window.scrollY; app.innerHTML=h; window.scrollTo(0,y);
  bindView();
}

function viewFijos(c){
  const pct=c.totalF>0?Math.min(100,c.pagado/c.totalF*100):0;
  const paid=c.fijos.filter(x=>x.pagado).length;
  let h=`<div class="salary"><label for="sueldoIn">Sueldo del mes</label><span class="lead"></span>
    <span class="in"><span class="cur">$</span><input id="sueldoIn" inputmode="decimal" placeholder="0" value="${fmtIn(S.sueldo)}" aria-label="Sueldo del mes en pesos"></span></div>
  <section class="figure" aria-label="Resumen">
    <div class="lbl caps">${c.saldo<0?"Te faltan para cubrir los fijos":"Te queda después de los fijos"}</div>
    <div class="big ${c.saldo<0?"neg":""}">${bigMoney(c.saldo)}</div>
    <div class="rule" role="progressbar" aria-label="Porcentaje pagado" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
    <div class="trio">
      <div><b>${money(c.totalF)}</b><small>Total fijos</small></div>
      <div><b>${money(c.pagado)}</b><small>Ya pagaste</small></div>
      <div><b>${money(c.falta)}</b><small>Falta pagar</small></div>
    </div>
  </section>
  <div class="sec"><h2>Pagos</h2><span>${paid}/${c.fijos.length}</span></div><div class="ledger">`;
  if(!c.fijos.length) h+=`<div class="empty-list">Todavía no hay gastos fijos.</div>`;
  for(const x of c.fijos){
    const hasM=x.monto!=null&&x.monto!=="";
    h+=`<div class="item ${x.pagado?"paid":""}">
      <button class="chk" data-toggle="${esc(x.id)}" aria-pressed="${!!x.pagado}" aria-label="${x.pagado?"Marcar como pendiente":"Marcar como pagado"}: ${esc(x.desc)}">${CHECK}</button>
      <button class="body" data-edit="fijos" data-id="${esc(x.id)}">
        <div class="l1"><span class="t">${esc(x.desc)}</span><span class="lead"></span><span class="amt ${hasM?"":"empty"}">${hasM?money(x.monto):"Cargar monto"}</span></div>
        <div class="s">${esc(x.cat||"Sin categoría")}</div>
      </button></div>`;
  }
  h+=`</div><div class="actions">
    <button class="btn" data-add="fijos">Agregar gasto fijo</button>
    <button class="btn ghost" id="nuevoMes">Cerrar el mes y empezar otro</button></div>`;
  return h;
}

function viewChicos(c){
  const list=[...S.chicos].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
  let h=`<section class="figure" aria-label="Resumen">
    <div class="lbl caps">Gastaste en el día a día</div>
    <div class="big">${bigMoney(c.totalC)}</div>
    <div class="trio two">
      <div><b>${money(c.saldo)}</b><small>Libre tras los fijos</small></div>
      <div><b class="${c.resto<0?"amt neg":""}">${money(c.resto)}</b><small>Te queda ahora</small></div>
    </div></section>
  <div class="sec"><h2>Movimientos</h2><span>${list.length}</span></div><div class="ledger">`;
  if(!list.length) h+=`<div class="empty-list">Nada anotado todavía.</div>`;
  for(const x of list){
    h+=`<div class="item"><button class="body" data-edit="chicos" data-id="${esc(x.id)}">
      <div class="l1"><span class="t">${esc(x.desc)}</span><span class="lead"></span><span class="amt">${money(x.monto)}</span></div>
      <div class="s">${esc([fmtDate(x.fecha),x.cat].filter(Boolean).join("  ·  "))}</div></button></div>`;
  }
  h+=`</div><div class="actions"><button class="btn" data-add="chicos">Anotar gasto</button></div>`;
  return h;
}

function viewComp(c){
  const list=[...S.comp].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
  const even=Math.abs(c.neto)<0.005;
  const de=c.neto>0?"Sabri":"Rodri", a=c.neto>0?"Rodri":"Sabri";
  let h=`<section class="figure" aria-label="Balance">
    <div class="lbl caps owe">${even?"Cuentas al día":`${de} <span class="arrow">→</span> ${a}`}</div>
    <div class="big">${bigMoney(c.neto)}</div>
    <div class="trio two">
      <div><b>${money(c.pr)}</b><small>Pagó Rodri</small></div>
      <div><b>${money(c.ps)}</b><small>Pagó Sabri</small></div>
    </div>
    ${!even?`<div class="actions"><button class="btn ghost" id="saldar">Registrar que se saldó</button></div>`:""}
  </section>
  <div class="sec"><h2>En común</h2><span>${money(c.totalS)}</span></div><div class="ledger">`;
  if(!list.length) h+=`<div class="empty-list">Sin gastos compartidos.</div>`;
  for(const x of list){
    const p=x.pagador==="Sabri"?"s":"r";
    const sub=[fmtDate(x.fecha),x.cat,x.division&&x.division!=="mitad"?DIV[x.division]:null,x.notas].filter(Boolean).join("  ·  ");
    h+=`<div class="item"><span class="who ${p}" aria-label="Pagó ${p==="s"?"Sabri":"Rodri"}">${p==="s"?"S":"R"}</span>
      <button class="body" data-edit="compartidos" data-id="${esc(x.id)}">

function viewHist(c){
  const list=[...S.hist].sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  let h="";
  if(list.length){
    const avg=list.reduce((t,m)=>t+(m.totalF||0)+(m.totalC||0),0)/list.length;
    h+=`<section class="figure" aria-label="Resumen"><div class="lbl caps">Gasto promedio por mes</div>
      <div class="big">${bigMoney(avg)}</div>
      <div class="trio two"><div><b>${list.length}</b><small>${list.length===1?"Mes guardado":"Meses guardados"}</small></div>
      <div><b>${money(c.totalF+c.totalC)}</b><small>Este mes, hasta ahora</small></div></div></section>`;
  }
  h+=`<div class="sec"><h2>Meses cerrados</h2></div><div class="ledger">`;
  if(!list.length) h+=`<div class="empty-list">Cuando cierres un mes desde Fijos, va a quedar guardado acá con todos sus pagos.</div>`;
  for(const m of list){
    const gastos=(m.totalF||0)+(m.totalC||0), saldo=(m.sueldo||0)-gastos;
    const pct=m.sueldo>0?Math.min(100,gastos/m.sueldo*100):100;
    h+=`<div class="item"><button class="body" data-hist="${esc(m.id)}">
      <div class="l1"><span class="t cap">${esc(mesLabel(m.id))}</span><span class="lead"></span><span class="amt ${saldo<0?"neg":"pos"}">${saldo<0?"−":"+"}${money(Math.abs(saldo))}</span></div>
      <div class="s">Gastaste ${money(gastos)} de ${money(m.sueldo)}</div>
      <div class="mbar"><span class="${gastos>(m.sueldo||0)?"over":""}" style="width:${pct}%"></span></div></button></div>`;
  }
  h+=`</div>
  <div class="sec"><h2>Copia de seguridad</h2></div>
  <p class="note">Tus datos viven solo en este celu. Guardá una copia de vez en cuando por si cambiás de teléfono.</p>
  <div class="actions" style="margin-top:0">
    <button class="btn" id="bkSave">Guardar copia</button>
    <button class="btn ghost" id="bkLoad">Restaurar desde una copia</button>
    <input type="file" id="bkFile" accept="application/json,.json" hidden>
  </div>`;
  return h;
}

function bindView(){
  const si=document.getElementById("sueldoIn");
  if(si){ si.addEventListener("change",()=>{ S.sueldo=parseMoney(si.value); save(); render(); });
    si.addEventListener("keydown",e=>{ if(e.key==="Enter") si.blur(); }); }
  app.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
    const x=S.fijos.find(f=>f.id===b.dataset.toggle); if(!x) return; x.pagado=!x.pagado; save(); render(); });
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openForm(b.dataset.edit,b.dataset.id));
  app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openForm(b.dataset.add,null));
  app.querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>openHist(b.dataset.hist));
  const on=(id,f)=>{ const e=document.getElementById(id); if(e) e.onclick=f; };
  on("nuevoMes",openNuevoMes); on("saldar",openSaldar); on("bkSave",saveBackup);
  on("catsBtn",()=>openCats(tab==="comp"?"comp":tab));
  const bf=document.getElementById("bkFile"), bl=document.getElementById("bkLoad");
  if(bl&&bf){ bl.onclick=()=>bf.click(); bf.onchange=()=>{ if(bf.files[0]) loadBackup(bf.files[0]); bf.value=""; }; }
}

/* ---------- hoja inferior ---------- */
const sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim");
let lastFocus=null;
function openSheet(html,focus=true){
  lastFocus=document.activeElement;
  sheet.innerHTML=html; sheet.scrollTop=0;
  sheet.classList.add("on"); scrim.classList.add("on");
  if(focus) setTimeout(()=>{ const f=sheet.querySelector("input:not([type=radio]):not([type=checkbox]),select"); if(f) f.focus({preventScroll:true}); },260);
}
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); if(lastFocus) try{lastFocus.focus({preventScroll:true})}catch(e){} }
scrim.onclick=closeSheet;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheet.classList.contains("on")) closeSheet(); });

const seg=(name,pairs,v)=>`<div class="seg" role="radiogroup">${pairs.map(([val,lbl])=>`<label><input type="radio" name="${name}" value="${val}" ${val===v?"checked":""}><span>${esc(lbl)}</span></label>`).join("")}</div>`;
function catSelect(key,cur){
  const list=[...S.cats[key]]; if(cur&&!list.includes(cur)) list.push(cur);
  return `<label class="field"><span class="caps">Categoría</span><select name="cat">
    <option value="" ${!cur?"selected":""}>Sin categoría</option>
    ${list.map(a=>`<option ${a===cur?"selected":""}>${esc(a)}</option>`).join("")}
    <option value="__new">+ Nueva categoría…</option></select></label>
    <label class="field" id="newCatF" hidden><span class="caps">Nombre de la nueva categoría</span><input name="newcat" autocomplete="off" placeholder="Ej: Gimnasio"></label>`;
}

function openForm(coll,id){
  const x=id?S[COLL[coll]].find(i=>i.id===id):null;
  const key=CATKEY[coll];
  let title,fields;
  if(coll==="fijos"){
    title=x?"Editar gasto fijo":"Nuevo gasto fijo";
    fields=`<label class="field"><span class="caps">Descripción</span><input name="desc" value="${esc(x?.desc||"")}" placeholder="Ej: Alquiler" autocomplete="off"></label>
      <label class="field"><span class="caps">Monto</span><input class="money" name="monto" inputmode="decimal" value="${fmtIn(x?.monto)}" placeholder="Vacío si todavía no llegó"></label>
      ${catSelect(key,x?x.cat:"")}
      <div class="field"><span class="caps">Estado</span>${seg("pagado",[["0","Pendiente"],["1","Pagado"]],x?.pagado?"1":"0")}</div>`;
  }else if(coll==="chicos"){
    title=x?"Editar gasto":"Nuevo gasto del día";
    fields=`<label class="field"><span class="caps">Descripción</span><input name="desc" value="${esc(x?.desc||"")}" placeholder="Ej: Carga de nafta" autocomplete="off"></label>
      <label class="field"><span class="caps">Monto</span><input class="money" name="monto" inputmode="decimal" value="${fmtIn(x?.monto)}" placeholder="0"></label>
      ${catSelect(key,x?x.cat:"")}
      <label class="field"><span class="caps">Fecha</span><input name="fecha" type="date" value="${esc(x?.fecha||today())}"></label>`;
  }else{
    title=x?"Editar gasto compartido":"Nuevo gasto compartido";
    fields=`<label class="field"><span class="caps">Descripción</span><input name="desc" value="${esc(x?.desc||"")}" placeholder="Ej: Supermercado" autocomplete="off"></label>
      <label class="field"><span class="caps">Monto total</span><input class="money" name="monto" inputmode="decimal" value="${fmtIn(x?.monto)}" placeholder="0"></label>
      <div class="field"><span class="caps">¿Quién pagó?</span>${seg("pagador",[["Rodri","Rodri"],["Sabri","Sabri"]],x?.pagador||"Rodri")}</div>
      <div class="field"><span class="caps">¿Cómo se divide?</span>${seg("division",[["mitad","Mitad y mitad"],["rodri","Todo de Rodri"],["sabri","Todo de Sabri"]],x?.division||"mitad")}</div>
      ${catSelect(key,x?x.cat:"")}
      <label class="field"><span class="caps">Fecha</span><input name="fecha" type="date" value="${esc(x?.fecha||today())}"></label>
      <label class="field"><span class="caps">Notas (opcional)</span><input name="notas" value="${esc(x?.notas||"")}" autocomplete="off"></label>`;
  }
  openSheet(`<h3 id="sheetTitle">${title}</h3><form id="f" novalidate>${fields}
    <div class="err" id="ferr" role="alert"></div>
    <div class="row-btns">${x?`<button type="button" class="btn danger" id="fdel">Borrar</button>`:""}
    <button type="submit" class="btn">${x?"Guardar":"Agregar"}</button></div></form>`);
  const f=document.getElementById("f");
  const sel=f.elements.cat, nc=document.getElementById("newCatF");
  sel.onchange=()=>{ nc.hidden=sel.value!=="__new"; if(!nc.hidden) f.elements.newcat.focus(); };
  f.onsubmit=e=>{
    e.preventDefault();
    const g=n=>f.elements[n]?f.elements[n].value:undefined;
    const err=document.getElementById("ferr");
    const desc=(g("desc")||"").trim(); const monto=parseMoney(g("monto"));
    if(!desc){ err.textContent="Escribí una descripción."; return; }
    if(coll!=="fijos"&&(monto==null||monto<=0)){ err.textContent="Ingresá un monto mayor a cero."; return; }
    let cat=g("cat");
    if(cat==="__new"){
      cat=(g("newcat")||"").trim();
      if(!cat){ err.textContent="Escribí el nombre de la categoría."; return; }
      const exist=S.cats[key].find(c=>c.toLowerCase()===cat.toLowerCase());
      if(exist) cat=exist; else S.cats[key].push(cat);
    }
    let data;
    if(coll==="fijos"){
      const maxO=S.fijos.reduce((m,i)=>Math.max(m,i.orden??0),0);
      data={desc,monto,cat,pagado:g("pagado")==="1",orden:x?.orden??maxO+1};
    }else if(coll==="chicos"){
      data={desc,monto,cat,fecha:g("fecha")||today(),creado:x?.creado??Date.now()};
    }else{
      data={desc,monto,pagador:g("pagador"),division:g("division"),cat,fecha:g("fecha")||today(),notas:(g("notas")||"").trim(),creado:x?.creado??Date.now()};
    }
    put(coll,x?x.id:newId(),data); closeSheet(); toast(x?"Guardado":"Agregado");
  };
  const fd=document.getElementById("fdel");
  if(fd) fd.onclick=()=>{ if(fd.dataset.sure){ del(coll,x.id); closeSheet(); toast("Borrado"); } else { fd.dataset.sure="1"; fd.textContent="Tocá de nuevo"; } };
}

/* ---------- categorías ---------- */
function openCats(key){
  const names={fijos:"Fijos",chicos:"Del día",comp:"Compartidos"};
  const uses=c=>S[key].filter(x=>x.cat===c).length;
  const rows=S.cats[key].map((c,i)=>{ const n=uses(c);
    return `<div class="catrow"><input value="${esc(c)}" data-i="${i}" aria-label="Nombre de la categoría ${esc(c)}">
      <span class="uses">${n?n+(n===1?" uso":" usos"):""}</span>
      <button class="x" data-del="${i}" aria-label="Borrar categoría ${esc(c)}">×</button></div>`; }).join("");
  openSheet(`<h3 id="sheetTitle">Categorías</h3>
    <div class="cattabs">${["fijos","chicos","comp"].map(k=>`<button class="caps" data-ck="${k}" aria-pressed="${k===key}">${names[k]}</button>`).join("")}</div>
    <p style="margin-bottom:6px">Tocá un nombre para cambiarlo. Los gastos que la usan se actualizan solos.</p>
    <div>${rows||`<div class="empty-list">No hay categorías.</div>`}</div>
    <div class="catadd"><input id="catNew" placeholder="Nueva categoría" autocomplete="off"><button class="btn" id="catAdd">Agregar</button></div>
    <div class="err" id="cerr" role="alert"></div>
    <div class="row-btns"><button class="btn ghost" id="catClose">Listo</button></div>`,false);
  sheet.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>openCats(b.dataset.ck));
  const cerr=document.getElementById("cerr");
  sheet.querySelectorAll(".catrow input").forEach(inp=>{
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") inp.blur(); });
    inp.addEventListener("change",()=>{
      const i=+inp.dataset.i, old=S.cats[key][i], nu=inp.value.trim();
      if(!nu){ inp.value=old; cerr.textContent="El nombre no puede quedar vacío."; return; }
      if(nu!==old&&S.cats[key].some((c,j)=>j!==i&&c.toLowerCase()===nu.toLowerCase())){ inp.value=old; cerr.textContent="Ya existe una categoría con ese nombre."; return; }
      cerr.textContent="";
      S.cats[key][i]=nu; for(const x of S[key]) if(x.cat===old) x.cat=nu;
      save(); render(); toast("Categoría renombrada");
    });
  });
  sheet.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.del, c=S.cats[key][i], n=uses(c);
    if(n&&!b.dataset.sure){ b.dataset.sure="1"; b.classList.add("sure"); b.textContent=`Borrar (${n} quedan sin categoría)`; return; }
    S.cats[key].splice(i,1); for(const x of S[key]) if(x.cat===c) x.cat="";
    save(); render(); openCats(key); toast("Categoría borrada");
  });
  const add=()=>{ const v=document.getElementById("catNew").value.trim();
    if(!v) return;
    if(S.cats[key].some(c=>c.toLowerCase()===v.toLowerCase())){ cerr.textContent="Esa categoría ya existe."; return; }
    S.cats[key].push(v); save(); openCats(key); toast("Categoría agregada");
    setTimeout(()=>{ const n=document.getElementById("catNew"); if(n) n.focus(); },50); };
  document.getElementById("catAdd").onclick=add;
  document.getElementById("catNew").addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
  document.getElementById("catClose").onclick=closeSheet;
}

/* ---------- cierre de mes, saldo, historial ---------- */
function openNuevoMes(){
  const n=S.chicos.length;
  openSheet(`<h3 id="sheetTitle">Cerrar el mes</h3>
    <label class="field"><span class="caps">Mes que cerrás</span><input type="month" id="nmMes" value="${defMes()}"></label>
    <p>Se guarda en el historial con todos sus pagos. Después los fijos vuelven a pendiente; los montos y el sueldo quedan para que solo cambies lo que varió.</p>
    <label class="chkline"><input type="checkbox" id="borrarChicos" ${n?"checked":""}><span>Borrar también los gastos del día (${n})</span></label>
    <div class="row-btns"><button class="btn ghost" id="nmNo">Cancelar</button><button class="btn" id="nmSi">Cerrar mes</button></div>`,false);
  document.getElementById("nmNo").onclick=closeSheet;
  document.getElementById("nmSi").onclick=()=>{
    const mes=document.getElementById("nmMes").value, borrar=document.getElementById("borrarChicos").checked;
    if(!/^\d{4}-\d{2}$/.test(mes)){ toast("Elegí el mes que cerrás"); return; }
    const c=calc();
    const snap={sueldo:c.sueldo,totalF:c.totalF,pagado:c.pagado,totalC:c.totalC,neto:c.neto,cerrado:Date.now(),
      fijos:c.fijos.map(x=>({desc:x.desc||"",cat:x.cat||"",monto:x.monto??null,pagado:!!x.pagado})),
      chicos:S.chicos.map(x=>({desc:x.desc||"",cat:x.cat||"",monto:Number(x.monto)||0,fecha:x.fecha||""}))};
    const i=S.hist.findIndex(h=>h.id===mes); if(i>=0) S.hist[i]={id:mes,...snap}; else S.hist.push({id:mes,...snap});
    S.fijos.forEach(x=>x.pagado=false); if(borrar) S.chicos=[];
    save(); closeSheet(); render(); toast("Mes guardado en el historial");
  };
}
function openSaldar(){
  const c=calc(); const de=c.neto>0?"Sabri":"Rodri", a=c.neto>0?"Rodri":"Sabri", m=Math.abs(c.neto);
  openSheet(`<h3 id="sheetTitle">Saldar cuentas</h3>
    <p>Se anota un pago de ${money(m)} de ${de} a ${a} y el balance queda en cero. El historial se conserva.</p>
    <div class="row-btns"><button class="btn ghost" id="sdNo">Cancelar</button><button class="btn" id="sdSi">Registrar pago</button></div>`,false);
  document.getElementById("sdNo").onclick=closeSheet;
  document.getElementById("sdSi").onclick=()=>{
    put("compartidos",newId(),{desc:`Pago de ${de} a ${a}`,monto:m,pagador:de,division:a==="Rodri"?"rodri":"sabri",cat:"",fecha:today(),notas:"Saldo de cuentas",creado:Date.now()});
    closeSheet(); toast("Cuentas saldadas");
  };
}
function openHist(id){
  const m=S.hist.find(x=>x.id===id); if(!m) return;
  const gastos=(m.totalF||0)+(m.totalC||0), saldo=(m.sueldo||0)-gastos, neto=m.neto||0;
  const bal=Math.abs(neto)<0.005?"Al día":(neto>0?"Sabri → Rodri ":"Rodri → Sabri ")+money(Math.abs(neto));
  const line=(t,s,a)=>`<div class="item"><div class="body"><div class="l1"><span class="t">${esc(t)}</span><span class="lead"></span><span class="amt">${a}</span></div><div class="s">${esc(s)}</div></div></div>`;
  const fij=(m.fijos||[]).map(x=>line(x.desc,(x.pagado?"Pagado":"Quedó pendiente")+(x.cat?"  ·  "+x.cat:""),x.monto==null?"—":money(x.monto))).join("")||`<div class="empty-list">Sin gastos fijos</div>`;
  const chi=[...(m.chicos||[])].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).map(x=>line(x.desc,[fmtDate(x.fecha),x.cat].filter(Boolean).join("  ·  "),money(x.monto))).join("")||`<div class="empty-list">Sin gastos del día</div>`;
  openSheet(`<h3 id="sheetTitle" style="text-transform:capitalize">${esc(mesLabel(id))}</h3>
    <dl class="dl"><dt>Sueldo</dt><dd>${money(m.sueldo)}</dd><dt>Gastos fijos</dt><dd>${money(m.totalF)}</dd>
      <dt>Gastos del día</dt><dd>${money(m.totalC)}</dd><dt>${saldo<0?"Faltó":"Sobró"}</dt><dd class="${saldo<0?"neg":"pos"}">${money(Math.abs(saldo))}</dd>
      <dt>Compartidos al cierre</dt><dd>${esc(bal)}</dd></dl>
    <div class="sec" style="margin-top:18px"><h2>Fijos</h2><span>${(m.fijos||[]).filter(x=>x.pagado).length}/${(m.fijos||[]).length}</span></div><div class="ledger mini">${fij}</div>
    <div class="sec"><h2>Del día</h2></div><div class="ledger mini">${chi}</div>
    <div class="row-btns" style="margin-top:20px"><button class="btn danger" id="hdel">Borrar mes</button><button class="btn ghost" id="hclose">Cerrar</button></div>`,false);
  document.getElementById("hclose").onclick=closeSheet;
  const hd=document.getElementById("hdel");
  hd.onclick=()=>{ if(hd.dataset.sure){ del("historial",id); closeSheet(); toast("Mes borrado"); } else { hd.dataset.sure="1"; hd.textContent="Tocá de nuevo"; } };
}

/* ---------- copia de seguridad ---------- */
async function saveBackup(){
  const name="pagos-copia-"+today()+".json";
  const data={app:"control-pagos",version:2,guardado:new Date().toISOString(),sueldo:S.sueldo,fijos:S.fijos,chicos:S.chicos,comp:S.comp,hist:S.hist,cats:S.cats};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  try{ const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Copia de pagos"}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("Copia guardada");
}
function loadBackup(file){
  const r=new FileReader();
  r.onload=()=>{ try{
      const v=JSON.parse(r.result); if(!v||v.app!=="control-pagos") throw 0;
      openSheet(`<h3 id="sheetTitle">Restaurar copia</h3>
        <p>Se reemplaza todo lo que hay ahora por la copia del ${esc(new Date(v.guardado).toLocaleDateString("es-AR"))}.</p>
        <div class="row-btns"><button class="btn ghost" id="rbNo">Cancelar</button><button class="btn" id="rbSi">Restaurar</button></div>`,false);
      document.getElementById("rbNo").onclick=closeSheet;
      document.getElementById("rbSi").onclick=()=>{ applyData(v); save(); closeSheet(); render(); toast("Copia restaurada"); };
    }catch(e){ toast("Ese archivo no es una copia de esta app"); } };
  r.readAsText(file);
}

let tt; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2000); }

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; try{history.replaceState(null,"","#"+tab)}catch(e){} window.scrollTo(0,0); render(); });
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(TABS.includes(h)&&h!==tab){ tab=h; render(); } });

load(); render();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
})();
</script>
