<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de pagos</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pagos">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --ink:#16233B; --muted:#5E6B80; --line:#D3DAE3;
  --accent:#2F4FD0; --accent-ink:#FFFFFF; --ok:#1E7A55; --ok-soft:#DCF0E6;
  --bad:#B53A24; --bad-soft:#F7E1DB; --track:#D9E0E8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --surface:#18202F; --ink:#E8EDF5; --muted:#98A3B6; --line:#2A3446;
    --accent:#7F98FF; --accent-ink:#0F1522; --ok:#5CC896; --ok-soft:#173528;
    --bad:#F08B72; --bad-soft:#3A1F19; --track:#273042; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#18202F; --ink:#E8EDF5; --muted:#98A3B6; --line:#2A3446;
  --accent:#7F98FF; --accent-ink:#0F1522; --ok:#5CC896; --ok-soft:#173528;
  --bad:#F08B72; --bad-soft:#3A1F19; --track:#273042; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

main{max-width:560px;margin:0 auto;padding:20px 16px 120px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:0}
.top .mes{color:var(--muted);font-weight:600;text-transform:capitalize}

.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:.9rem;margin-bottom:14px}

/* Sueldo */
.sueldo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 14px}
.sueldo label{font-weight:600;color:var(--muted)}
.sueldo .money-in{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:62%}
.sueldo input{border:0;background:transparent;font-weight:700;font-size:1.1rem;width:100%;text-align:right;outline:none}

/* Hero */
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:20px 20px 18px;margin-bottom:16px}
.hero .lbl{font-weight:600;opacity:.75;font-size:.95rem}
.hero .big{font-size:2.35rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 14px;word-break:break-word}
.hero .big.neg{color:#FFB4A2}
:root[data-theme="dark"] .hero .big.neg{color:#B53A24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .big.neg{color:#B53A24}}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--bg);border-radius:99px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{min-width:0}
.stats b{display:block;font-size:.98rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats small{opacity:.72;font-size:.8rem}

/* Lists */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px}
.sec h2{font-size:1.05rem;margin:0;font-weight:700}
.sec span{color:var(--muted);font-size:.9rem}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:62px}
.row:first-child{border-top:0}
.row .body{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;align-items:center;gap:10px}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:700;white-space:nowrap}
.row .amt.empty{color:var(--accent);font-weight:600;font-size:.9rem}
.row.paid .t{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.row.paid .amt{color:var(--muted)}
.chk{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.chk svg{width:16px;height:16px;opacity:0}
.row.paid .chk{background:var(--ok);border-color:var(--ok)}
.row.paid .chk svg{opacity:1}
.chk svg path{stroke:var(--surface)}
.who{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--track)}
.who.r{background:#DCE3FF;color:#2F4FD0}
.who.s{background:#FCE3D3;color:#A2471B}
:root[data-theme="dark"] .who.r,:root[data-theme="dark"] .who.s{filter:saturate(.8) brightness(.85)}
.empty-list{padding:22px 16px;color:var(--muted);text-align:center}
.mbar{height:6px;border-radius:9px;background:var(--track);overflow:hidden;margin-top:7px}
.mbar span{display:block;height:100%;background:var(--accent);border-radius:9px}
.mbar span.over{background:var(--bad)}
.row .amt.neg,.dl dd.neg{color:var(--bad)}
.row .amt.pos,.dl dd.pos{color:var(--ok)}
.t.cap{text-transform:capitalize}
.dl{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0 0 18px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:700;text-align:right}
.mini{font-size:.92rem}
.mini .row{min-height:48px;padding:8px 12px}

.actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Balance */
.balance{border-radius:20px;padding:20px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line)}
.balance .who-owes{font-size:1.05rem;font-weight:600;color:var(--muted)}
.balance .big{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:2px 0 14px}
.balance.even .big{color:var(--ok)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{background:var(--bg);border-radius:12px;padding:10px 12px}
.split small{color:var(--muted);font-size:.8rem;display:block}
.split b{font-size:1rem}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-weight:600;font-size:.8rem}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:20px 20px 0 0;
  max-width:560px;margin:0 auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .25s ease;max-height:92vh;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:1.2rem}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);font-size:1rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;min-width:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:11px 6px;border:1px solid var(--line);border-radius:10px;font-weight:600;color:var(--ink);margin:0;font-size:.9rem;background:var(--bg)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.sheet .row-btns{display:flex;gap:10px;margin-top:6px}
.sheet .row-btns .btn{flex:1}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:4px 0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;opacity:0;transition:.2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-tab="fijos" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      Fijos
    </button>
    <button data-tab="chicos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 10.5c0-1.2 1.3-2 3-2s3 .8 3 2-1.3 1.6-3 1.6-3 .5-3 1.8 1.3 2 3 2 3-.8 3-2"/></svg>
      Del día
    </button>
    <button data-tab="comp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c.8-2.8 2.7-4 5-4s4.2 1.2 5 4M11 19c.8-2.8 2.7-4 5-4s4.2 1.2 5 4"/></svg>
      Compartidos
    </button>
    <button data-tab="hist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h3M7 17h6"/></svg>
      Historial
    </button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
const CAT_FIJOS=["Alquiler / Vivienda","Tarjeta de Crédito","Tarjeta / Billetera Virtual","Préstamos / Financiación","Servicios","Impuestos / Tasas","Seguros","Otros"];
const CAT_COMP=["Supermercado","Combustible / Auto","Salidas / Ocio","Casa","Servicios","Otros"];
const DIV={mitad:"Mitad y mitad",rodri:"100% Rodri",sabri:"100% Sabri"};

const S={sueldo:null,fijos:[],chicos:[],comp:[],hist:[],loading:true,stale:false,canWrite:true,mode:"db"};
let tab="fijos";
let db=null;
const TABS=["fijos","chicos","comp","hist"];
try{const h=location.hash.slice(1); if(TABS.includes(h)) tab=h;}catch(e){}

/* ---------- formato ---------- */
const nf=new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:0,maximumFractionDigits:2});
const money=n=>nf.format(Number(n)||0);
function parseMoney(str){
  if(str==null) return null;
  let s=String(str).replace(/[^\d.,-]/g,"").trim();
  if(!s) return null;
  if(s.includes(",")){ s=s.replace(/\./g,"").replace(",","."); }
  else if((s.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(s)){ s=s.replace(/\./g,""); }
  const n=parseFloat(s);
  return isFinite(n)?Math.round(n*100)/100:null;
}
const fmtIn=n=>n==null?"":new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(n);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function defMes(){ const d=new Date(); if(d.getDate()<=15) d.setMonth(d.getMonth()-1,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
const mesLabel=k=>{ const [y,m]=String(k).split("-").map(Number); return y&&m?new Date(y,m-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"}):String(k); };
function fmtDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("es-AR",{day:"numeric",month:"short"}); }
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- datos (db o local) ---------- */
const LKEY="control-pagos-local-v1";
const SEED={sueldo:1848130.76,
  fijos:[["f01","ALQUILER","Alquiler / Vivienda",600000],["f02","MACRO VISA SUSI","Tarjeta de Crédito",564000],["f03","MERCADO MASTER RODRI","Tarjeta de Crédito",630000],["f04","MERCADOPAGO RODRI","Tarjeta / Billetera Virtual",243000],["f05","REFINANCIACION ICBC","Préstamos / Financiación",294000],["f06","LUZ","Servicios",null],["f07","GAS","Servicios",null],["f08","AGUA","Servicios",null],["f09","MUNICIPAL","Impuestos / Tasas",null]].map((r,i)=>({id:r[0],desc:r[1],cat:r[2],monto:r[3],pagado:false,orden:i+1})),
  chicos:[{id:"c01",desc:"Carga de nafta (use macro)",monto:70000,fecha:"2026-11-04",creado:1}],
  comp:[{id:"s01",desc:"Nafta YPF",cat:"Combustible / Auto",monto:40000,pagador:"Rodri",division:"mitad",fecha:"2025-05-10",notas:"Carga tanque común",creado:1},
        {id:"s02",desc:"Supermercado Coto",cat:"Supermercado",monto:65000,pagador:"Sabri",division:"mitad",fecha:"2025-05-12",notas:"Compras del mes",creado:2},
        {id:"s03",desc:"Cena / Salida",cat:"Salidas / Ocio",monto:28000,pagador:"Rodri",division:"mitad",fecha:"2025-05-15",notas:"Cena fin de semana",creado:3}],
  hist:[]};
function loadLocal(){ try{ if(localStorage.getItem(LKEY)===null){ localStorage.setItem(LKEY,JSON.stringify(SEED)); } }catch(e){ Object.assign(S,JSON.parse(JSON.stringify(SEED))); }
  try{const v=JSON.parse(localStorage.getItem(LKEY)||"null"); if(v){S.sueldo=v.sueldo??null;S.fijos=v.fijos||[];S.chicos=v.chicos||[];S.comp=v.comp||[];S.hist=v.hist||[];}}catch(e){} }
function saveLocal(){ try{localStorage.setItem(LKEY,JSON.stringify({sueldo:S.sueldo,fijos:S.fijos,chicos:S.chicos,comp:S.comp,hist:S.hist}));}catch(e){} }
const ARR={fijos:"fijos",chicos:"chicos",compartidos:"comp",historial:"hist"};

async function put(coll,id,data){
  if(db){
    try{ await db.collection(coll).doc(id).set(data); return true; }
    catch(e){ handleWriteErr(e); return false; }
  }else{
    const a=S[ARR[coll]]; const i=a.findIndex(x=>x.id===id);
    if(i>=0) a[i]={id,...data}; else a.push({id,...data});
    saveLocal(); render(); return true;
  }
}
async function del(coll,id){
  if(db){ try{ await db.collection(coll).doc(id).delete(); }catch(e){ handleWriteErr(e); } }
  else{ S[ARR[coll]]=S[ARR[coll]].filter(x=>x.id!==id); saveLocal(); render(); }
}
async function putSueldo(v){
  if(db){ try{ await db.doc("config/main").set({sueldo:v}); }catch(e){ handleWriteErr(e); } }
  else{ S.sueldo=v; saveLocal(); render(); }
}
function handleWriteErr(e){
  if(e&&e.code==="invalid_argument"){ S.canWrite=false; toast("No tenés permiso para editar esta planilla"); render(); }
  else if(e&&e.code==="quota_exceeded"){ toast("Se llenó el espacio: borrá gastos viejos"); }
  else toast("No se pudo guardar. Probá de nuevo.");
}

function connect(){
  if(!window.claude||typeof window.claude.use!=="function"){ S.mode="local"; S.loading=false; loadLocal(); render(); return; }
  window.claude.use("db").then(async d=>{
    if(!d){ S.mode="local"; S.loading=false; loadLocal(); render(); return; }
    db=d;
    try{ const u=await window.claude.use("user"); const c=u?await u.can("data.write"):null; if(c===false) S.canWrite=false; }catch(e){}
    const got={cfg:false,f:false,c:false,s:false,h:false};
    const timer=setTimeout(()=>{ S.stale=true; S.loading=false; render(); },10000);
    const done=(k,snap)=>{ if(snap&&snap.metadata&&!snap.metadata.fromCache) got[k]=true;
      if(got.cfg&&got.f&&got.c&&got.s&&got.h){ clearTimeout(timer); S.stale=false; }
      S.loading=false; render(); };
    const onErr=()=>{ clearTimeout(timer); S.loading=false; S.stale=true; render(); };
    db.doc("config/main").onSnapshot(s=>{ const v=s.exists?s.data():null; S.sueldo=v&&typeof v.sueldo==="number"?v.sueldo:null; done("cfg",s); },onErr);
    db.collection("fijos").onSnapshot(s=>{ S.fijos=s.docs.map(x=>({id:x.id,...x.data()})); done("f",s); },onErr);
    db.collection("chicos").onSnapshot(s=>{ S.chicos=s.docs.map(x=>({id:x.id,...x.data()})); done("c",s); },onErr);
    db.collection("compartidos").onSnapshot(s=>{ S.comp=s.docs.map(x=>({id:x.id,...x.data()})); done("s",s); },onErr);
    db.collection("historial").onSnapshot(s=>{ S.hist=s.docs.map(x=>({id:x.id,...x.data()})); done("h",s); },onErr);
  });
}

/* ---------- cálculos ---------- */
function calc(){
  const fijos=[...S.fijos].sort((a,b)=>(a.orden??0)-(b.orden??0));
  const totalF=fijos.reduce((t,x)=>t+(Number(x.monto)||0),0);
  const pagado=fijos.filter(x=>x.pagado).reduce((t,x)=>t+(Number(x.monto)||0),0);
  const totalC=S.chicos.reduce((t,x)=>t+(Number(x.monto)||0),0);
  const sueldo=Number(S.sueldo)||0;
  let pr=0,ps=0,parteR=0,totalS=0;
  for(const x of S.comp){ const m=Number(x.monto)||0; totalS+=m;
    if(x.pagador==="Sabri") ps+=m; else pr+=m;
    parteR+= x.division==="rodri"?m : x.division==="sabri"?0 : m/2; }
  const neto=Math.round((pr-parteR)*100)/100; // >0: Sabri le debe a Rodri
  return {fijos,totalF,pagado,falta:totalF-pagado,totalC,sueldo,saldo:sueldo-totalF,resto:sueldo-totalF-totalC,pr,ps,totalS,neto,
    sinMonto:fijos.filter(x=>x.monto==null||x.monto==="").length};
}

/* ---------- render ---------- */
const CHECK='<svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const app=document.getElementById("app");

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const c=calc();
  const mes=new Date().toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  let h=`<div class="top"><h1>${tab==="fijos"?"Gastos fijos":tab==="chicos"?"Gastos del día":tab==="hist"?"Historial":"Rodri y Sabri"}</h1><span class="mes">${esc(mes)}</span></div>`;
  if(S.loading) h+=`<div class="note">Cargando tus datos…</div>`;
  else if(S.stale) h+=`<div class="note">No se pudo conectar con los datos guardados. Lo que ves puede no estar al día.</div>`;
  if(!S.canWrite) h+=`<div class="note">Podés ver la planilla, pero no editarla.</div>`;
  if(tab==="fijos") h+=viewFijos(c); else if(tab==="chicos") h+=viewChicos(c); else if(tab==="hist") h+=viewHist(c); else h+=viewComp(c);
  const y=window.scrollY; app.innerHTML=h; window.scrollTo(0,y);
  bindView();
}

function viewFijos(c){
  const pct=c.totalF>0?Math.min(100,c.pagado/c.totalF*100):0;
  let h=`<div class="sueldo"><label for="sueldoIn">Sueldo del mes</label>
    <div class="money-in"><span>$</span><input id="sueldoIn" inputmode="decimal" placeholder="0" value="${fmtIn(S.sueldo)}" ${S.canWrite?"":"disabled"} aria-label="Sueldo del mes en pesos"></div></div>
  <section class="hero" aria-label="Resumen">
    <div class="lbl">${c.saldo<0?"Te faltan para cubrir los fijos":"Te queda después de los fijos"}</div>
    <div class="big ${c.saldo<0?"neg":""}">${money(Math.abs(c.saldo))}</div>
    <div class="bar" role="progressbar" aria-label="Pagado" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
    <div class="stats">
      <div><b>${money(c.totalF)}</b><small>Total fijos</small></div>
      <div><b>${money(c.pagado)}</b><small>Ya pagaste</small></div>
      <div><b>${money(c.falta)}</b><small>Falta pagar</small></div>
    </div>
  </section>
  <div class="sec"><h2>Tus pagos</h2><span>${c.fijos.filter(x=>x.pagado).length} de ${c.fijos.length} pagados</span></div>
  <div class="list">`;
  if(!c.fijos.length) h+=`<div class="empty-list">Todavía no cargaste gastos fijos. Agregá el primero abajo.</div>`;
  for(const x of c.fijos){
    const hasM=x.monto!=null&&x.monto!=="";
    h+=`<div class="row ${x.pagado?"paid":""}">
      <button class="chk" data-toggle="${esc(x.id)}" aria-pressed="${!!x.pagado}" aria-label="${x.pagado?"Marcar como pendiente":"Marcar como pagado"}: ${esc(x.desc)}" ${S.canWrite?"":"disabled"}>${CHECK}</button>
      <button class="body" data-edit="fijos" data-id="${esc(x.id)}">
        <div class="txt"><div class="t">${esc(x.desc)}</div><div class="s">${esc(x.cat||"")}</div></div>
        <div class="amt ${hasM?"":"empty"}">${hasM?money(x.monto):"Cargar monto"}</div>
      </button></div>`;
  }
  h+=`</div><div class="actions">
    <button class="btn" data-add="fijos" ${S.canWrite?"":"disabled"}>Agregar gasto fijo</button>
    <button class="btn ghost" id="nuevoMes" ${S.canWrite?"":"disabled"}>Empezar mes nuevo</button></div>`;
  return h;
}

function viewChicos(c){
  const list=[...S.chicos].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
  let h=`<section class="hero" aria-label="Resumen">
    <div class="lbl">Gastaste en el día a día</div>
    <div class="big">${money(c.totalC)}</div>
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div><b>${money(c.saldo)}</b><small>Libre tras los fijos</small></div>
      <div><b>${money(c.resto)}</b><small>Te queda ahora</small></div>
    </div></section>
  <div class="sec"><h2>Movimientos</h2><span>${list.length} ${list.length===1?"gasto":"gastos"}</span></div><div class="list">`;
  if(!list.length) h+=`<div class="empty-list">Sin gastos cargados. Anotá el primero con el botón de abajo.</div>`;
  for(const x of list){
    h+=`<div class="row"><button class="body" data-edit="chicos" data-id="${esc(x.id)}">
      <div class="txt"><div class="t">${esc(x.desc)}</div><div class="s">${esc(fmtDate(x.fecha))}</div></div>
      <div class="amt">${money(x.monto)}</div></button></div>`;
  }
  h+=`</div><div class="actions"><button class="btn" data-add="chicos" ${S.canWrite?"":"disabled"}>Anotar gasto</button></div>`;
  return h;
}

function viewComp(c){
  const list=[...S.comp].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
  const even=Math.abs(c.neto)<0.005;
  const quien=even?"Cuentas al día":c.neto>0?"Sabri le debe a Rodri":"Rodri le debe a Sabri";
  let h=`<section class="balance ${even?"even":""}" aria-label="Balance">
    <div class="who-owes">${quien}</div>
    <div class="big">${money(Math.abs(c.neto))}</div>
    <div class="split">
      <div><small>Pagó Rodri</small><b>${money(c.pr)}</b></div>
      <div><small>Pagó Sabri</small><b>${money(c.ps)}</b></div>
    </div>
    ${!even&&S.canWrite?`<div class="actions"><button class="btn ghost" id="saldar">Registrar que se saldó</button></div>`:""}
  </section>
  <div class="sec"><h2>Gastos en común</h2><span>Total ${money(c.totalS)}</span></div><div class="list">`;
  if(!list.length) h+=`<div class="empty-list">No hay gastos compartidos todavía.</div>`;
  for(const x of list){
    const p=x.pagador==="Sabri"?"s":"r";
    const sub=[fmtDate(x.fecha),x.cat,x.division&&x.division!=="mitad"?DIV[x.division]:null,x.notas].filter(Boolean).join(", ");
    h+=`<div class="row"><button class="body" data-edit="compartidos" data-id="${esc(x.id)}">
      <span class="who ${p}" aria-label="Pagó ${p==="s"?"Sabri":"Rodri"}">${p==="s"?"S":"R"}</span>
      <div class="txt"><div class="t">${esc(x.desc)}</div><div class="s">${esc(sub)}</div></div>
      <div class="amt">${money(x.monto)}</div></button></div>`;
  }
  h+=`</div><div class="actions"><button class="btn" data-add="compartidos" ${S.canWrite?"":"disabled"}>Agregar gasto compartido</button></div>`;

}

function viewHist(c){
  const list=[...S.hist].sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  let h="";
  if(list.length){
    const avg=list.reduce((t,m)=>t+(m.totalF||0)+(m.totalC||0),0)/list.length;
    h+=`<section class="hero" aria-label="Resumen">
      <div class="lbl">Gasto promedio por mes</div>
      <div class="big">${money(avg)}</div>
      <div class="stats" style="grid-template-columns:1fr 1fr">
        <div><b>${list.length}</b><small>${list.length===1?"Mes guardado":"Meses guardados"}</small></div>
        <div><b>${money(c.totalF+c.totalC)}</b><small>Este mes, hasta ahora</small></div>
      </div></section>`;
  }
  h+=`<div class="sec"><h2>Meses cerrados</h2><span>Lo que sobró o faltó</span></div><div class="list">`;
  if(!list.length) h+=`<div class="empty-list">Todavía no hay meses guardados. Cuando toques “Empezar mes nuevo” en Fijos, el mes que cerrás queda guardado acá con todos sus pagos.</div>`;
  for(const m of list){
    const gastos=(m.totalF||0)+(m.totalC||0), saldo=(m.sueldo||0)-gastos;
    const pct=m.sueldo>0?Math.min(100,gastos/m.sueldo*100):100;
    h+=`<div class="row"><button class="body" data-hist="${esc(m.id)}">
      <div class="txt"><div class="t cap">${esc(mesLabel(m.id))}</div>
        <div class="s">Gastaste ${money(gastos)} de ${money(m.sueldo)}</div>
        <div class="mbar"><span class="${gastos>(m.sueldo||0)?"over":""}" style="width:${pct}%"></span></div></div>
      <div class="amt ${saldo<0?"neg":"pos"}">${saldo<0?"−":"+"}${money(Math.abs(saldo))}</div></button></div>`;
  }
  h+=`</div>
  <div class="sec"><h2>Copia de seguridad</h2></div>
  <div class="note" style="margin:0 0 10px">Tus datos se guardan solo en este celular. Guardá una copia de vez en cuando por si cambiás de teléfono o se borran los datos del navegador.</div>
  <div class="actions" style="margin-top:0">
    <button class="btn" id="bkSave">Guardar copia</button>
    <button class="btn ghost" id="bkLoad">Restaurar desde una copia</button>
    <input type="file" id="bkFile" accept="application/json,.json" hidden>
  </div>`;
  return h;
}

function backupData(){ return {app:"control-pagos",version:1,guardado:new Date().toISOString(),sueldo:S.sueldo,fijos:S.fijos,chicos:S.chicos,comp:S.comp,hist:S.hist}; }
async function saveBackup(){
  const name="pagos-copia-"+today()+".json";
  const blob=new Blob([JSON.stringify(backupData(),null,1)],{type:"application/json"});
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Copia de pagos"}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("Copia guardada");
}
function loadBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const v=JSON.parse(r.result);
      if(!v||v.app!=="control-pagos") throw 0;
      openSheet(`<h3 id="sheetTitle">Restaurar copia</h3>
        <p style="margin:0 0 16px;color:var(--muted)">Se reemplaza todo lo que hay ahora en la app por la copia del ${esc(new Date(v.guardado).toLocaleDateString("es-AR"))}.</p>
        <div class="row-btns"><button class="btn ghost" id="rbNo">Cancelar</button><button class="btn" id="rbSi">Restaurar</button></div>`);
      document.getElementById("rbNo").onclick=closeSheet;
      document.getElementById("rbSi").onclick=()=>{
        S.sueldo=v.sueldo??null; S.fijos=v.fijos||[]; S.chicos=v.chicos||[]; S.comp=v.comp||[]; S.hist=v.hist||[];
        saveLocal(); closeSheet(); render(); toast("Copia restaurada");
      };
    }catch(e){ toast("Ese archivo no es una copia de esta app"); }
  };
  r.readAsText(file);
}

function bindView(){
  const si=document.getElementById("sueldoIn");
  if(si){
    si.addEventListener("change",()=>{ const v=parseMoney(si.value); if(v!==S.sueldo){ S.sueldo=v; putSueldo(v); } });
    si.addEventListener("keydown",e=>{ if(e.key==="Enter") si.blur(); });
  }
  app.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
    const x=S.fijos.find(f=>f.id===b.dataset.toggle); if(!x) return;
    const {id,...rest}=x; rest.pagado=!x.pagado; x.pagado=rest.pagado; render(); put("fijos",id,rest);
  });
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openForm(b.dataset.edit,b.dataset.id));
  app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openForm(b.dataset.add,null));
  app.querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>openHist(b.dataset.hist));
  const nm=document.getElementById("nuevoMes"); if(nm) nm.onclick=openNuevoMes;
  const sd=document.getElementById("saldar"); if(sd) sd.onclick=openSaldar;
  const bs=document.getElementById("bkSave"); if(bs) bs.onclick=saveBackup;
  const bf=document.getElementById("bkFile"), bl=document.getElementById("bkLoad");
  if(bl&&bf){ bl.onclick=()=>bf.click(); bf.onchange=()=>{ if(bf.files[0]) loadBackup(bf.files[0]); bf.value=""; }; }
}

/* ---------- hoja inferior ---------- */
const sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim");
let lastFocus=null;
function openSheet(html){
  lastFocus=document.activeElement;
  sheet.innerHTML=`<div class="grab"></div>`+html;
  sheet.classList.add("on"); scrim.classList.add("on");
  setTimeout(()=>{ const f=sheet.querySelector("input:not([type=radio]),select,button"); if(f) f.focus({preventScroll:true}); },260);
}
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); if(lastFocus) try{lastFocus.focus({preventScroll:true})}catch(e){} }
scrim.onclick=closeSheet;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheet.classList.contains("on")) closeSheet(); });

const opt=(arr,v)=>arr.map(a=>`<option ${a===v?"selected":""}>${esc(a)}</option>`).join("");
const seg=(name,pairs,v)=>`<div class="seg" role="radiogroup">${pairs.map(([val,lbl])=>`<label><input type="radio" name="${name}" value="${val}" ${val===v?"checked":""}><span>${esc(lbl)}</span></label>`).join("")}</div>`;

function openForm(coll,id){
  const src=S[ARR[coll]]; const x=id?src.find(i=>i.id===id):null;
  const ro=!S.canWrite;
  let title,fields;
  if(coll==="fijos"){
    title=x?"Editar gasto fijo":"Nuevo gasto fijo";
    fields=`<label class="field"><span>Descripción</span><input name="desc" value="${esc(x?.desc||"")}" placeholder="Ej: Alquiler" autocomplete="off"></label>
      <label class="field"><span>Monto</span><input name="monto" inputmode="decimal" value="${fmtIn(x?.monto)}" placeholder="Dejalo vacío si todavía no llegó"></label>
      <label class="field"><span>Categoría</span><select name="cat">${opt(CAT_FIJOS,x?.cat||"Servicios")}</select></label>
      <div class="field"><span>Estado</span>${seg("pagado",[["0","Pendiente"],["1","Pagado"]],x?.pagado?"1":"0")}</div>`;
  }else if(coll==="chicos"){
    title=x?"Editar gasto":"Nuevo gasto del día";
    fields=`<label class="field"><span>Descripción</span><input name="desc" value="${esc(x?.desc||"")}" placeholder="Ej: Carga de nafta" autocomplete="off"></label>
      <label class="field"><span>Monto</span><input name="monto" inputmode="decimal" value="${fmtIn(x?.monto)}" placeholder="0"></label>
      <label class="field"><span>Fecha</span><input name="fecha" type="date" value="${esc(x?.fecha||today())}"></label>`;
  }else{
    title=x?"Editar gasto compartido":"Nuevo gasto compartido";
    fields=`<label class="field"><span>Descripción</span><input name="desc" value="${esc(x?.desc||"")}" placeholder="Ej: Supermercado" autocomplete="off"></label>
      <label class="field"><span>Monto total</span><input name="monto" inputmode="decimal" value="${fmtIn(x?.monto)}" placeholder="0"></label>
      <div class="field"><span>¿Quién pagó?</span>${seg("pagador",[["Rodri","Rodri"],["Sabri","Sabri"]],x?.pagador||"Rodri")}</div>
      <div class="field"><span>¿Cómo se divide?</span>${seg("division",[["mitad","Mitad y mitad"],["rodri","Todo de Rodri"],["sabri","Todo de Sabri"]],x?.division||"mitad")}</div>
      <label class="field"><span>Categoría</span><select name="cat">${opt(CAT_COMP,x?.cat||"Supermercado")}</select></label>
      <label class="field"><span>Fecha</span><input name="fecha" type="date" value="${esc(x?.fecha||today())}"></label>
      <label class="field"><span>Notas (opcional)</span><input name="notas" value="${esc(x?.notas||"")}" autocomplete="off"></label>`;
  }
  openSheet(`<h3 id="sheetTitle">${title}</h3><form id="f" novalidate><fieldset style="border:0;padding:0;margin:0" ${ro?"disabled":""}>${fields}</fieldset>
    <div class="err" id="ferr" role="alert"></div>
    <div class="row-btns">${x&&!ro?`<button type="button" class="btn danger" id="fdel">Borrar</button>`:""}
    <button type="submit" class="btn" ${ro?"disabled":""}>${x?"Guardar cambios":"Agregar"}</button></div></form>`);
  const f=document.getElementById("f");
  f.onsubmit=e=>{
    e.preventDefault();
    const g=n=>f.elements[n]?f.elements[n].value:undefined;
    const desc=(g("desc")||"").trim(); const monto=parseMoney(g("monto"));
    const err=document.getElementById("ferr");
    if(!desc){ err.textContent="Escribí una descripción."; return; }
    if(coll!=="fijos"&&(monto==null||monto<=0)){ err.textContent="Ingresá un monto mayor a cero."; return; }
    let data;
    if(coll==="fijos"){
      const maxO=S.fijos.reduce((m,i)=>Math.max(m,i.orden??0),0);
      data={desc,monto,cat:g("cat"),pagado:g("pagado")==="1",orden:x?.orden??maxO+1};
    }else if(coll==="chicos"){
      data={desc,monto,fecha:g("fecha")||today(),creado:x?.creado??Date.now()};
    }else{
      data={desc,monto,pagador:g("pagador"),division:g("division"),cat:g("cat"),fecha:g("fecha")||today(),notas:(g("notas")||"").trim(),creado:x?.creado??Date.now()};
    }
    put(coll,x?x.id:newId(),data); closeSheet(); toast(x?"Cambios guardados":"Agregado");
  };
  const fd=document.getElementById("fdel");
  if(fd) fd.onclick=()=>{
    if(fd.dataset.sure){ del(coll,x.id); closeSheet(); toast("Borrado"); }
    else { fd.dataset.sure="1"; fd.textContent="Tocá de nuevo para borrar"; }
  };
}

function openNuevoMes(){
  const n=S.chicos.length;
  openSheet(`<h3 id="sheetTitle">Empezar mes nuevo</h3>
    <label class="field"><span>Mes que cerrás</span><input type="month" id="nmMes" value="${defMes()}"></label>
    <p style="margin:0 0 12px;color:var(--muted)">Ese mes se guarda en el historial con todos sus pagos. Después, los gastos fijos vuelven a “Pendiente”; los montos y el sueldo se mantienen para que solo cambies lo que varió.</p>
    <label style="display:flex;gap:10px;align-items:flex-start;margin-bottom:16px"><input type="checkbox" id="borrarChicos" ${n?"checked":""} style="width:22px;height:22px;margin-top:2px">
      <span>Borrar también los gastos del día (${n})</span></label>
    <div class="row-btns"><button class="btn ghost" id="nmNo">Cancelar</button><button class="btn" id="nmSi">Empezar mes</button></div>`);
  document.getElementById("nmNo").onclick=closeSheet;
  document.getElementById("nmSi").onclick=async()=>{
    const borrar=document.getElementById("borrarChicos").checked;
    const mes=document.getElementById("nmMes").value;
    if(!/^\d{4}-\d{2}$/.test(mes)){ toast("Elegí el mes que cerrás"); return; }
    const c=calc();
    const snap={sueldo:c.sueldo,totalF:c.totalF,pagado:c.pagado,totalC:c.totalC,neto:c.neto,cerrado:Date.now(),
      fijos:c.fijos.map(x=>({desc:x.desc||"",cat:x.cat||"",monto:x.monto??null,pagado:!!x.pagado})),
      chicos:S.chicos.map(x=>({desc:x.desc||"",monto:Number(x.monto)||0,fecha:x.fecha||""}))};
    closeSheet();
    if(!(await put("historial",mes,snap))) return;
    for(const x of S.fijos.filter(f=>f.pagado)){ const {id,...r}=x; r.pagado=false; await put("fijos",id,r); }
    if(borrar) for(const x of [...S.chicos]) await del("chicos",x.id);
    toast("Listo, mes nuevo");
  };
}

function openSaldar(){
  const c=calc(); const deudor=c.neto>0?"Sabri":"Rodri", acreedor=c.neto>0?"Rodri":"Sabri";
  openSheet(`<h3 id="sheetTitle">Saldar cuentas</h3>
    <p style="margin:0 0 16px;color:var(--muted)">Se agrega un movimiento de ${money(Math.abs(c.neto))} pagado por ${deudor} a ${acreedor}, y el balance queda en cero. El historial se conserva.</p>
    <div class="row-btns"><button class="btn ghost" id="sdNo">Cancelar</button><button class="btn" id="sdSi">Registrar pago</button></div>`);
  document.getElementById("sdNo").onclick=closeSheet;
  document.getElementById("sdSi").onclick=()=>{
    const m=Math.abs(c.neto);
    put("compartidos",newId(),{desc:`Pago de ${deudor} a ${acreedor}`,monto:m,pagador:deudor,division:acreedor==="Rodri"?"rodri":"sabri",cat:"Otros",fecha:today(),notas:"Saldo de cuentas",creado:Date.now()});
    closeSheet(); toast("Cuentas saldadas");
  };
}

function openHist(id){
  const m=S.hist.find(x=>x.id===id); if(!m) return;
  const gastos=(m.totalF||0)+(m.totalC||0), saldo=(m.sueldo||0)-gastos, neto=m.neto||0;
  const bal=Math.abs(neto)<0.005?"Al día":(neto>0?"Sabri le debía ":"Rodri le debía ")+money(Math.abs(neto));
  const fij=(m.fijos||[]).map(x=>`<div class="row"><div class="txt"><div class="t">${esc(x.desc)}</div><div class="s">${x.pagado?"Pagado":"Quedó pendiente"}</div></div><div class="amt">${x.monto==null?"Sin monto":money(x.monto)}</div></div>`).join("")||`<div class="empty-list">Sin gastos fijos</div>`;
  const chi=[...(m.chicos||[])].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).map(x=>`<div class="row"><div class="txt"><div class="t">${esc(x.desc)}</div><div class="s">${esc(fmtDate(x.fecha))}</div></div><div class="amt">${money(x.monto)}</div></div>`).join("")||`<div class="empty-list">Sin gastos del día</div>`;
  openSheet(`<h3 id="sheetTitle" style="text-transform:capitalize">${esc(mesLabel(id))}</h3>
    <dl class="dl"><dt>Sueldo</dt><dd>${money(m.sueldo)}</dd>
      <dt>Gastos fijos</dt><dd>${money(m.totalF)}</dd>
      <dt>Gastos del día</dt><dd>${money(m.totalC)}</dd>
      <dt>${saldo<0?"Faltó":"Sobró"}</dt><dd class="${saldo<0?"neg":"pos"}">${money(Math.abs(saldo))}</dd>
      <dt>Compartidos al cierre</dt><dd>${esc(bal)}</dd></dl>
    <div class="sec" style="margin-top:0"><h2>Fijos</h2><span>${(m.fijos||[]).filter(x=>x.pagado).length} de ${(m.fijos||[]).length} pagados</span></div><div class="list mini">${fij}</div>
    <div class="sec"><h2>Del día</h2></div><div class="list mini">${chi}</div>
    <div class="row-btns" style="margin-top:16px">${S.canWrite?`<button class="btn danger" id="hdel">Borrar mes</button>`:""}<button class="btn ghost" id="hclose">Cerrar</button></div>`);
  document.getElementById("hclose").onclick=closeSheet;
  const hd=document.getElementById("hdel");
  if(hd) hd.onclick=()=>{
    if(hd.dataset.sure){ del("historial",id); closeSheet(); toast("Mes borrado"); }
    else { hd.dataset.sure="1"; hd.textContent="Tocá de nuevo para borrar"; }
  };
}

let tt; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2000); }

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; try{history.replaceState(null,"","#"+tab)}catch(e){} window.scrollTo(0,0); render(); });
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(TABS.includes(h)&&h!==tab){ tab=h; render(); } });

render();
connect();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
})();
</script>
</body>
